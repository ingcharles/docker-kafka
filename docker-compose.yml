# Stack combinado — levanta Kafka y los microservicios de la saga de
# e-commerce juntos bajo un solo `docker compose up`. Cada stack sigue
# funcionando de forma independiente desde su propia carpeta (ver kafka/,
# ecommerce/); este archivo solo los incluye a los dos sin duplicar sus
# definiciones de servicio. ecommerce/ depende del broker de kafka/
# (nombre de red fijo `kafka_net`) — con `include:`, Compose levanta
# kafka/ primero sin importar el orden del listado, porque los servicios
# de ecommerce/ declaran esa dependencia.
#
# Requiere que el .env de cada stack ya exista — copia kafka/.env.example
# a kafka/.env, y ecommerce/.env.example a ecommerce/.env antes de correrlo.
include:
  - path: kafka/docker-compose.yml
    env_file: kafka/.env
  - path: ecommerce/docker-compose.yml
    env_file: ecommerce/.env
