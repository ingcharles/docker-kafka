# =============================================================================
# DATASOURCE — Postgres, esquema "firma_electronica" dentro de la base de datos compartida "facturacion"
# =============================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${FIRMA_DB_USER:firma_service}
quarkus.datasource.password=${FIRMA_DB_PASSWORD}
# Pool reactivo: lo usa la aplicación en tiempo de ejecución (Hibernate Reactive Panache).
quarkus.datasource.reactive.url=${FIRMA_DB_REACTIVE_URL:postgresql://localhost:5434/facturacion}
%dev.quarkus.datasource.reactive.max-size=10
%prod.quarkus.datasource.reactive.max-size=20
# Pool JDBC bloqueante: lo usa únicamente Flyway al arrancar, Hibernate Reactive nunca lo toca.
quarkus.datasource.jdbc.url=${FIRMA_DB_JDBC_URL:jdbc:postgresql://localhost:5434/facturacion}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.default-schema=firma_electronica
quarkus.flyway.schemas=firma_electronica

# =============================================================================
# SERVIDOR HTTP
# =============================================================================
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.root-path=/empresas/api/v1
# CORS: solo los orígenes de CORS_ORIGINS (separados por coma, sin comodín) y solo los métodos que este
# servicio realmente expone. En producción CORS_ORIGINS es obligatorio: sin él el servicio no arranca.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
%prod.quarkus.http.cors.origins=${CORS_ORIGINS}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.exposed-headers=Location
quarkus.http.cors.access-control-max-age=PT1H
quarkus.http.cors.access-control-allow-credentials=false

# =============================================================================
# SWAGGER UI — botón "Authorize" para probar endpoints protegidos por api-key
# desde la propia UI (ver infrastructure.security.ApiKeyAuthFilter).
# =============================================================================
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=api-key
quarkus.smallrye-openapi.security-scheme-description=Api-key JWT emitida por identidad-service (POST /api-keys) — pegar solo el token, sin la palabra "Bearer".
mp.openapi.filter=com.facturacion.commons.security.SecurityRequirementOpenApiFilter

# =============================================================================
# API-KEY — mismo secreto HS256 que identidad-service, verificado
# localmente por ApiKeyAuthFilter sin llamada de red (ver ARQUITECTURA.md).
# =============================================================================
identidad.jwt.clave-publica=${IDENTIDAD_JWT_CLAVE_PUBLICA}

# =============================================================================
# CIFRADO DEL CERTIFICADO DIGITAL
# =============================================================================
# Clave maestra AES-256 con la que se cifra en reposo el contenido del .p12
# y su contraseña antes de guardarlos — ver infrastructure.crypto.CifradoService.
firma.cifrado.clave-maestra=${FIRMA_CIFRADO_CLAVE_MAESTRA}

# =============================================================================
# KAFKA — eventos salientes de Empresa, comandos entrantes de firma, eventos salientes de firma
# =============================================================================
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

mp.messaging.outgoing.empresa-events-out.connector=smallrye-kafka
mp.messaging.outgoing.empresa-events-out.topic=facturacion.empresa.eventos.v1
mp.messaging.outgoing.empresa-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.empresa-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.empresa-events-out.acks=all
mp.messaging.outgoing.empresa-events-out.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:25000}
mp.messaging.outgoing.empresa-events-out.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:10000}
mp.messaging.outgoing.empresa-events-out.enable.idempotence=true

mp.messaging.outgoing.establecimiento-events-out.connector=smallrye-kafka
mp.messaging.outgoing.establecimiento-events-out.topic=facturacion.empresa.establecimientos.eventos.v1
mp.messaging.outgoing.establecimiento-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.establecimiento-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.establecimiento-events-out.acks=all
mp.messaging.outgoing.establecimiento-events-out.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:25000}
mp.messaging.outgoing.establecimiento-events-out.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:10000}
mp.messaging.outgoing.establecimiento-events-out.enable.idempotence=true

mp.messaging.outgoing.configuracion-events-out.connector=smallrye-kafka
mp.messaging.outgoing.configuracion-events-out.topic=facturacion.empresa.configuracion.eventos.v1
mp.messaging.outgoing.configuracion-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.configuracion-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.configuracion-events-out.acks=all
mp.messaging.outgoing.configuracion-events-out.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:25000}
mp.messaging.outgoing.configuracion-events-out.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:10000}
mp.messaging.outgoing.configuracion-events-out.enable.idempotence=true

mp.messaging.incoming.firma-comandos-in.connector=smallrye-kafka
mp.messaging.incoming.firma-comandos-in.topic=facturacion.firma.comandos.v1
mp.messaging.incoming.firma-comandos-in.group.id=firma-electronica-service
mp.messaging.incoming.firma-comandos-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.firma-comandos-in.value.deserializer=com.facturacion.firma.infrastructure.messaging.consumer.FirmarComprobanteCommandDeserializer
mp.messaging.incoming.firma-comandos-in.auto.offset.reset=earliest
mp.messaging.incoming.firma-comandos-in.enable.auto.commit=false
mp.messaging.incoming.firma-comandos-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.firma-comandos-in.dead-letter-queue.topic=facturacion.firma.comandos.v1.dlq

mp.messaging.outgoing.firma-events-out.connector=smallrye-kafka
mp.messaging.outgoing.firma-events-out.topic=facturacion.firma.eventos.v1
mp.messaging.outgoing.firma-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.firma-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.firma-events-out.acks=all
mp.messaging.outgoing.firma-events-out.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:25000}
mp.messaging.outgoing.firma-events-out.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:10000}
mp.messaging.outgoing.firma-events-out.enable.idempotence=true

# =============================================================================
# OPENAPI / SWAGGER
# =============================================================================
mp.openapi.scan.disable=false
# Swagger UI y el documento OpenAPI solo existen en desarrollo y pruebas (quarkus:dev, tests): en producción publicarían
# el mapa completo de la API. Para tenerlos en una imagen concreta, compilar con -Dquarkus.swagger-ui.always-include=true.
%prod.quarkus.smallrye-openapi.enabled=false

# =============================================================================
# LOGS
# =============================================================================
quarkus.log.level=INFO
# Vert.x crea un pool de Postgres por event loop y Micrometer avisa (una vez por servicio) que el gauge postgresql.queue.size ya estaba registrado;
# es inofensivo (el contador y los demás medidores se suman bien), por eso solo se muestran los errores de ese registro.
quarkus.log.category."io.micrometer.core.instrument.MeterRegistry".level=ERROR

# =============================================================================
# PRUEBAS
# =============================================================================
quarkus.test.continuous-testing=disabled

# -----------------------------------------------------------------------------
# Revocación de api-keys (publicada por identidad-service). Cada instancia usa
# un group.id propio y relee el tópico desde el inicio al arrancar: la lista de
# revocadas vive en memoria (RevocacionApiKeys, facturacion-commons).
# -----------------------------------------------------------------------------
mp.messaging.incoming.apikey-revocaciones-in.connector=smallrye-kafka
mp.messaging.incoming.apikey-revocaciones-in.topic=facturacion.apikey.revocaciones.v1
mp.messaging.incoming.apikey-revocaciones-in.group.id=${quarkus.uuid}
mp.messaging.incoming.apikey-revocaciones-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.apikey-revocaciones-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.apikey-revocaciones-in.auto.offset.reset=earliest
mp.messaging.incoming.apikey-revocaciones-in.enable.auto.commit=false
mp.messaging.incoming.apikey-revocaciones-in.failure-strategy=ignore

# =============================================================================
# TIMEOUTS — nada espera para siempre.
# Base de datos: se envían a Postgres como parámetros de cada conexión nueva. Una sentencia no pasa de statement_timeout,
# esperar un bloqueo (p. ej. el secuencial de un punto de emisión) no pasa de lock_timeout y una transacción abierta e
# inactiva (esperando algo externo) se cancela a los idle_in_transaction_session_timeout y suelta su conexión.
# Flyway usa JDBC y no se ve afectado. Las conexiones del pool se renuevan solas.
# Productores de Kafka: delivery.timeout.ms (arriba, por canal) es menor que el plazo de espera del relay del outbox
# (outbox.relay.timeout-ack): el cliente se da por vencido antes de que el relay suelte la transacción.
# Apagado: al recibir SIGTERM se esperan las peticiones en curso hasta este plazo (compose: stop_grace_period mayor).
# =============================================================================
quarkus.datasource.reactive.additional-properties.application_name=firma-electronica-service
quarkus.datasource.reactive.additional-properties.statement_timeout=${DB_STATEMENT_TIMEOUT:30s}
quarkus.datasource.reactive.additional-properties.lock_timeout=${DB_LOCK_TIMEOUT:10s}
quarkus.datasource.reactive.additional-properties.idle_in_transaction_session_timeout=${DB_IDLE_EN_TRANSACCION_TIMEOUT:60s}
quarkus.datasource.reactive.idle-timeout=PT10M
quarkus.datasource.reactive.max-lifetime=PT30M
quarkus.shutdown.timeout=${SHUTDOWN_TIMEOUT:PT30S}

# Outbox: plazo para el ack de Kafka (pasado el cual el relay suelta la transacción y reintenta en el siguiente ciclo) y
# espera inicial para que los emitters de Reactive Messaging estén conectados antes del primer ciclo.
outbox.relay.timeout-ack=${OUTBOX_TIMEOUT_ACK:PT30S}
outbox.relay.inicio-diferido=${OUTBOX_INICIO_DIFERIDO:15s}

# =============================================================================
# LOGS EN JSON (bandera LOG_FORMATO_JSON=true): una línea JSON por log, para que Loki/Grafana filtren por nivel y por
# campo. Apagado, los logs salen en texto legible (desarrollo).
# =============================================================================
quarkus.log.console.json.enabled=${LOG_FORMATO_JSON:false}
quarkus.log.console.json.additional-field.servicio.value=firma-electronica-service
