# =============================================================================
# DATASOURCE — Postgres, esquema "comprobantes" dentro de la base de datos compartida "facturacion"
# =============================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${COMPROBANTES_DB_USER:comprobantes_service}
quarkus.datasource.password=${COMPROBANTES_DB_PASSWORD}
quarkus.datasource.reactive.url=${COMPROBANTES_DB_REACTIVE_URL:postgresql://localhost:5434/facturacion}
%dev.quarkus.datasource.reactive.max-size=10
%prod.quarkus.datasource.reactive.max-size=20
quarkus.datasource.jdbc.url=${COMPROBANTES_DB_JDBC_URL:jdbc:postgresql://localhost:5434/facturacion}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.default-schema=comprobantes
quarkus.flyway.schemas=comprobantes

# =============================================================================
# SERVIDOR HTTP
# =============================================================================
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.root-path=/comprobantes/api/v1
quarkus.http.cors.enabled=true
quarkus.http.cors.methods=GET,POST
quarkus.http.cors.headers=Content-Type

# =============================================================================
# KAFKA — eventos salientes de comprobante, copia local de emisores, comandos entrantes del orquestador
# =============================================================================
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

mp.messaging.outgoing.comprobante-events-out.connector=smallrye-kafka
mp.messaging.outgoing.comprobante-events-out.topic=facturacion.comprobante.eventos.v1
mp.messaging.outgoing.comprobante-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.comprobante-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.comprobante-events-out.acks=all
mp.messaging.outgoing.comprobante-events-out.enable.idempotence=true

mp.messaging.incoming.emisor-events-in.connector=smallrye-kafka
mp.messaging.incoming.emisor-events-in.topic=facturacion.emisor.eventos.v1
mp.messaging.incoming.emisor-events-in.group.id=comprobantes-service
mp.messaging.incoming.emisor-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.emisor-events-in.value.deserializer=com.facturacion.comprobantes.infrastructure.messaging.consumer.EmisorEventMessageDeserializer
mp.messaging.incoming.emisor-events-in.auto.offset.reset=earliest
mp.messaging.incoming.emisor-events-in.enable.auto.commit=false
mp.messaging.incoming.emisor-events-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.emisor-events-in.dead-letter-queue.topic=facturacion.emisor.eventos.v1.dlq

mp.messaging.incoming.comprobante-comandos-in.connector=smallrye-kafka
mp.messaging.incoming.comprobante-comandos-in.topic=facturacion.comprobante.comandos.v1
mp.messaging.incoming.comprobante-comandos-in.group.id=comprobantes-service
mp.messaging.incoming.comprobante-comandos-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.comprobante-comandos-in.value.deserializer=com.facturacion.comprobantes.infrastructure.messaging.consumer.ActualizarComprobanteCommandDeserializer
mp.messaging.incoming.comprobante-comandos-in.auto.offset.reset=earliest
mp.messaging.incoming.comprobante-comandos-in.enable.auto.commit=false
mp.messaging.incoming.comprobante-comandos-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.comprobante-comandos-in.dead-letter-queue.topic=facturacion.comprobante.comandos.v1.dlq

mp.messaging.incoming.item-events-in.connector=smallrye-kafka
mp.messaging.incoming.item-events-in.topic=facturacion.inventario.item.eventos.v1
mp.messaging.incoming.item-events-in.group.id=comprobantes-service
mp.messaging.incoming.item-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.item-events-in.value.deserializer=com.facturacion.comprobantes.infrastructure.messaging.consumer.ItemEventMessageDeserializer
mp.messaging.incoming.item-events-in.auto.offset.reset=earliest
mp.messaging.incoming.item-events-in.enable.auto.commit=false
mp.messaging.incoming.item-events-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.item-events-in.dead-letter-queue.topic=facturacion.inventario.item.eventos.v1.dlq

# =============================================================================
# OPENAPI / SWAGGER
# =============================================================================
mp.openapi.scan.disable=false
quarkus.swagger-ui.always-include=true

# =============================================================================
# LOGS
# =============================================================================
quarkus.log.level=INFO

# =============================================================================
# PRUEBAS
# =============================================================================
quarkus.test.continuous-testing=disabled
