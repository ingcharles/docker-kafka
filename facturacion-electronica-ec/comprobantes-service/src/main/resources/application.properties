# =============================================================================
# DATASOURCE — Postgres, esquema "comprobantes" dentro de la base de datos compartida "facturacion"
# =============================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${COMPROBANTES_DB_USER:comprobantes_service}
quarkus.datasource.password=${COMPROBANTES_DB_PASSWORD}
quarkus.datasource.reactive.url=${COMPROBANTES_DB_REACTIVE_URL:postgresql://localhost:5434/facturacion}
%dev.quarkus.datasource.reactive.max-size=10
%prod.quarkus.datasource.reactive.max-size=20
quarkus.datasource.jdbc.url=${COMPROBANTES_DB_JDBC_URL:jdbc:postgresql://localhost:5434/facturacion}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.default-schema=comprobantes
quarkus.flyway.schemas=comprobantes

# =============================================================================
# SERVIDOR HTTP
# =============================================================================
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.root-path=/comprobantes/api/v1
quarkus.http.cors.enabled=true
quarkus.http.cors.methods=GET,POST,PUT
quarkus.http.cors.headers=Content-Type,Authorization,X-Catalogos-Admin-Token

# =============================================================================
# SWAGGER UI — botón "Authorize" para probar endpoints protegidos por api-key
# desde la propia UI (ver infrastructure.security.ApiKeyAuthFilter).
# =============================================================================
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=api-key
quarkus.smallrye-openapi.security-scheme-description=Api-key JWT emitida por identidad-service (POST /api-keys) — pegar solo el token, sin la palabra "Bearer".
mp.openapi.filter=com.facturacion.commons.security.SecurityRequirementOpenApiFilter

# =============================================================================
# API-KEY — mismo secreto HS256 que identidad-service, verificado
# localmente por ApiKeyAuthFilter sin llamada de red (ver ARQUITECTURA.md).
# =============================================================================
identidad.jwt.secreto=${IDENTIDAD_JWT_SECRET}

# =============================================================================
# KAFKA — eventos salientes de comprobante, comandos entrantes del orquestador,
# copia local del catálogo de inventario-service (para auto-derivar
# impuestos por itemId, ahora scoped por ruc — ver ItemLocal). Ya no consume
# facturacion.empresa.eventos.v1: los datos de la empresa viajan inline en cada
# request de creación, no hay réplica local de Empresa.
# =============================================================================
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

mp.messaging.outgoing.comprobante-events-out.connector=smallrye-kafka
mp.messaging.outgoing.comprobante-events-out.topic=facturacion.comprobante.eventos.v1
mp.messaging.outgoing.comprobante-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.comprobante-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.comprobante-events-out.acks=all
mp.messaging.outgoing.comprobante-events-out.enable.idempotence=true

mp.messaging.incoming.item-events-in.connector=smallrye-kafka
mp.messaging.incoming.item-events-in.topic=facturacion.inventario.item.eventos.v1
mp.messaging.incoming.item-events-in.group.id=comprobantes-service
mp.messaging.incoming.item-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.item-events-in.value.deserializer=com.facturacion.comprobantes.infrastructure.messaging.consumer.ItemEventMessageDeserializer
mp.messaging.incoming.item-events-in.auto.offset.reset=earliest
mp.messaging.incoming.item-events-in.enable.auto.commit=false
mp.messaging.incoming.item-events-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.item-events-in.dead-letter-queue.topic=facturacion.inventario.item.eventos.v1.dlq

mp.messaging.incoming.establecimiento-punto-emision-events-in.connector=smallrye-kafka
mp.messaging.incoming.establecimiento-punto-emision-events-in.topic=facturacion.empresa.establecimientos.eventos.v1
mp.messaging.incoming.establecimiento-punto-emision-events-in.group.id=comprobantes-service
mp.messaging.incoming.establecimiento-punto-emision-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.establecimiento-punto-emision-events-in.value.deserializer=com.facturacion.comprobantes.infrastructure.messaging.consumer.EstablecimientoPuntoEmisionEventMessageDeserializer
mp.messaging.incoming.establecimiento-punto-emision-events-in.auto.offset.reset=earliest
mp.messaging.incoming.establecimiento-punto-emision-events-in.enable.auto.commit=false
mp.messaging.incoming.establecimiento-punto-emision-events-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.establecimiento-punto-emision-events-in.dead-letter-queue.topic=facturacion.empresa.establecimientos.eventos.v1.dlq

mp.messaging.incoming.configuracion-empresa-events-in.connector=smallrye-kafka
mp.messaging.incoming.configuracion-empresa-events-in.topic=facturacion.empresa.configuracion.eventos.v1
mp.messaging.incoming.configuracion-empresa-events-in.group.id=comprobantes-service
mp.messaging.incoming.configuracion-empresa-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.configuracion-empresa-events-in.value.deserializer=com.facturacion.comprobantes.infrastructure.messaging.consumer.ConfiguracionEmpresaEventMessageDeserializer
mp.messaging.incoming.configuracion-empresa-events-in.auto.offset.reset=earliest
mp.messaging.incoming.configuracion-empresa-events-in.enable.auto.commit=false
mp.messaging.incoming.configuracion-empresa-events-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.configuracion-empresa-events-in.dead-letter-queue.topic=facturacion.empresa.configuracion.eventos.v1.dlq

mp.messaging.incoming.comprobante-comandos-in.connector=smallrye-kafka
mp.messaging.incoming.comprobante-comandos-in.topic=facturacion.comprobante.comandos.v1
mp.messaging.incoming.comprobante-comandos-in.group.id=comprobantes-service
mp.messaging.incoming.comprobante-comandos-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.comprobante-comandos-in.value.deserializer=com.facturacion.comprobantes.infrastructure.messaging.consumer.ActualizarComprobanteCommandDeserializer
mp.messaging.incoming.comprobante-comandos-in.auto.offset.reset=earliest
mp.messaging.incoming.comprobante-comandos-in.enable.auto.commit=false
mp.messaging.incoming.comprobante-comandos-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.comprobante-comandos-in.dead-letter-queue.topic=facturacion.comprobante.comandos.v1.dlq

# =============================================================================
# OPENAPI / SWAGGER
# =============================================================================
mp.openapi.scan.disable=false
quarkus.swagger-ui.always-include=true

# =============================================================================
# LOGS
# =============================================================================
quarkus.log.level=INFO

# =============================================================================
# PRUEBAS
# =============================================================================
quarkus.test.continuous-testing=disabled

# Monto máximo (USD) de una factura a consumidor final; por encima hay que identificar al adquirente (ficha técnica,
# 8.10: 50 USD). El historial de la ficha dice que este monto se ha actualizado: confirmar el vigente y ajustarlo aquí.
comprobantes.consumidor-final.monto-maximo=${CONSUMIDOR_FINAL_MONTO_MAXIMO:50.00}

# Token para MODIFICAR catálogos: son datos globales y una api-key de empresa no debe poder cambiarlos para todas
# las demás. Sin token configurado la escritura queda deshabilitada (403).
catalogos.admin.token=${CATALOGOS_ADMIN_TOKEN:}
