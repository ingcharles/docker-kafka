# Textos de los motivos que el orquestador registra en la saga (ver CodigoError). {0}, {1}... son parámetros.
# Archivo en UTF-8.

saga.reintento_automatico=Reintento automático {0} de {1}: sin respuesta en estado {2}, se vuelve a publicar el último comando.
saga.expirada=Sin respuesta en estado {0} tras {1} reintentos automáticos; requiere revisión manual (POST /sagas/{id}/retry para forzar otro intento).
saga.reintento_fallido=El reintento automático {0} de {1} falló y se descartó: {2}
log.watchdog_sagas_recuperadas={0} saga(s) reintentadas o expiradas
log.outbox_publicacion_fallida=No se pudo publicar el evento del outbox en Kafka; se reintenta en el siguiente ciclo
log.outbox_sin_emisor=No hay emitter configurado para el tópico del evento del outbox (error de configuración); se reintenta luego
log.watchdog_revision_fallida=Falló la revisión periódica de sagas; se vuelve a intentar en el siguiente ciclo
log.reintento_automatico_fallido=Falló el reintento automático de la saga; se cuenta como intento
log.reintento_no_registrado=No se pudo registrar el reintento fallido de la saga
saga.reenvio_automatico_notificacion=Reenvío automático {0} de {1} del correo: se pide a comprobantes-service que vuelva a publicar el comprobante autorizado.
log.reenvio_notificaciones_revisado={0} correo(s) reenviado(s) y {1} saga(s) sin respuesta devuelta(s) a NOTIFICACION_FALLIDA
saga.notificacion_sin_respuesta=No llegó el resultado del envío del correo en {0} minuto(s); la saga vuelve a NOTIFICACION_FALLIDA para reintentarlo.
log.reenvio_notificaciones_revision_fallida=Falló la revisión periódica de reenvío de correos; se vuelve a intentar en el siguiente ciclo
log.reenvio_automatico_fallido=Falló el reenvío automático del correo de la saga; no se contó como intento y se vuelve a intentar en el siguiente ciclo
saga.no_encontrada=No hay saga para el comprobante {0}
saga.payload_no_leible=No se pudo leer el payload guardado de la saga
saga.sin_comando_firma_pendiente=La saga {0} no tiene el comando de firma pendiente
