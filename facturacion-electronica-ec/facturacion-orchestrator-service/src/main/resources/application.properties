# =============================================================================
# DATASOURCE — Postgres, esquema "orquestacion" dentro de la base de datos compartida "facturacion"
# =============================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${ORQUESTACION_DB_USER:orquestacion_service}
quarkus.datasource.password=${ORQUESTACION_DB_PASSWORD}
quarkus.datasource.reactive.url=${ORQUESTACION_DB_REACTIVE_URL:postgresql://localhost:5434/facturacion}
%dev.quarkus.datasource.reactive.max-size=10
%prod.quarkus.datasource.reactive.max-size=20
quarkus.datasource.jdbc.url=${ORQUESTACION_DB_JDBC_URL:jdbc:postgresql://localhost:5434/facturacion}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.default-schema=orquestacion
quarkus.flyway.schemas=orquestacion

# =============================================================================
# SERVIDOR HTTP
# =============================================================================
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.root-path=/sagas/api/v1
# CORS: solo los orígenes de CORS_ORIGINS (separados por coma, sin comodín) y solo los métodos que este
# servicio realmente expone. En producción CORS_ORIGINS es obligatorio: sin él el servicio no arranca.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
%prod.quarkus.http.cors.origins=${CORS_ORIGINS}
quarkus.http.cors.methods=GET,POST
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.exposed-headers=Location
quarkus.http.cors.access-control-max-age=PT1H
quarkus.http.cors.access-control-allow-credentials=false

# =============================================================================
# SWAGGER UI — botón "Authorize" para probar endpoints protegidos por api-key
# desde la propia UI (ver infrastructure.security.ApiKeyAuthFilter).
# =============================================================================
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=api-key
quarkus.smallrye-openapi.security-scheme-description=Api-key JWT emitida por identidad-service (POST /api-keys) — pegar solo el token, sin la palabra "Bearer".
mp.openapi.filter=com.facturacion.commons.security.SecurityRequirementOpenApiFilter

# =============================================================================
# API-KEY — mismo secreto HS256 que identidad-service, verificado
# localmente por ApiKeyAuthFilter sin llamada de red (ver ARQUITECTURA.md).
# =============================================================================
identidad.jwt.clave-publica=${IDENTIDAD_JWT_CLAVE_PUBLICA}

# =============================================================================
# KAFKA — la única pieza que conoce los 4 dominios a la vez (comprobante,
# firma, sri, notificacion). Ver MessagingConstants para el mapa completo.
# =============================================================================
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

# --- Entrantes ---
mp.messaging.incoming.comprobante-events-in.connector=smallrye-kafka
mp.messaging.incoming.comprobante-events-in.topic=facturacion.comprobante.eventos.v1
mp.messaging.incoming.comprobante-events-in.group.id=facturacion-orchestrator
