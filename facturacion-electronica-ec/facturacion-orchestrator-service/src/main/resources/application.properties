mp.messaging.outgoing.firma-commands-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.firma-commands-out.acks=all
mp.messaging.outgoing.firma-commands-out.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:25000}
