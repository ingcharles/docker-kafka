mp.messaging.incoming.comprobante-events-in.auto.offset.reset=earliest
mp.messaging.incoming.comprobante-events-in.enable.auto.commit=false
mp.messaging.incoming.comprobante-events-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.comprobante-events-in.dead-letter-queue.topic=facturacion.comprobante.eventos.v1.dlq

mp.messaging.incoming.firma-events-in.connector=smallrye-kafka
