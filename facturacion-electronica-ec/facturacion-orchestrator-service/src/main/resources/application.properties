mp.messaging.outgoing.sri-commands-out.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:10000}
mp.messaging.outgoing.sri-commands-out.enable.idempotence=true

# =============================================================================
# OPENAPI / SWAGGER
# =============================================================================
mp.openapi.scan.disable=false
# Swagger UI y el documento OpenAPI solo existen en desarrollo y pruebas (quarkus:dev, tests): en producción publicarían
# el mapa completo de la API. Para tenerlos en una imagen concreta, compilar con -Dquarkus.swagger-ui.always-include=true.
%prod.quarkus.smallrye-openapi.enabled=false

# =============================================================================
# LOGS
# =============================================================================
quarkus.log.level=INFO
# Vert.x crea un pool de Postgres por event loop y Micrometer avisa (una vez por servicio) que el gauge postgresql.queue.size ya estaba registrado;
# es inofensivo (el contador y los demás medidores se suman bien), por eso solo se muestran los errores de ese registro.
quarkus.log.category."io.micrometer.core.instrument.MeterRegistry".level=ERROR

# =============================================================================
# PRUEBAS
# =============================================================================
quarkus.test.continuous-testing=disabled

# Watchdog de sagas atascadas (SagaWatchdog): si una saga espera la respuesta de otro servicio más del plazo de su
# estado, se vuelve a publicar su último comando; tras max-reintentos pasa a EXPIRADA.
saga.watchdog.habilitado=${SAGA_WATCHDOG_HABILITADO:true}
saga.watchdog.intervalo=${SAGA_WATCHDOG_INTERVALO:30s}
saga.watchdog.plazo-firma=${SAGA_WATCHDOG_PLAZO_FIRMA:PT2M}
saga.watchdog.plazo-sri=${SAGA_WATCHDOG_PLAZO_SRI:PT15M}
saga.watchdog.max-reintentos=${SAGA_WATCHDOG_MAX_REINTENTOS:3}

# Reenvío automático de correos fallidos (ReenvioNotificacionesJob). APAGADO por defecto: el reenvío manual
# (POST /sagas/reenviar-notificaciones) funciona igual con el job encendido o apagado. Cada ciclo atiende hasta "lote"
# sagas; una saga se reenvía hasta "max-intentos" veces con "espera-minima" entre intentos; si el resultado del envío no
# llega en "plazo-respuesta", la saga vuelve a NOTIFICACION_FALLIDA.
saga.reenvio-notificaciones.habilitado=${SAGA_REENVIO_NOTIFICACIONES_HABILITADO:false}
saga.reenvio-notificaciones.intervalo=${SAGA_REENVIO_NOTIFICACIONES_INTERVALO:5m}
saga.reenvio-notificaciones.lote=${SAGA_REENVIO_NOTIFICACIONES_LOTE:20}
saga.reenvio-notificaciones.espera-minima=${SAGA_REENVIO_NOTIFICACIONES_ESPERA_MINIMA:PT15M}
saga.reenvio-notificaciones.plazo-respuesta=${SAGA_REENVIO_NOTIFICACIONES_PLAZO_RESPUESTA:PT10M}
saga.reenvio-notificaciones.max-intentos=${SAGA_REENVIO_NOTIFICACIONES_MAX_INTENTOS:3}

# -----------------------------------------------------------------------------
# Revocación de api-keys (publicada por identidad-service). Cada instancia usa
# un group.id propio y relee el tópico desde el inicio al arrancar: la lista de
# revocadas vive en memoria (RevocacionApiKeys, facturacion-commons).
# -----------------------------------------------------------------------------
mp.messaging.incoming.apikey-revocaciones-in.connector=smallrye-kafka
mp.messaging.incoming.apikey-revocaciones-in.topic=facturacion.apikey.revocaciones.v1
mp.messaging.incoming.apikey-revocaciones-in.group.id=${quarkus.uuid}
mp.messaging.incoming.apikey-revocaciones-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.apikey-revocaciones-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.apikey-revocaciones-in.auto.offset.reset=earliest
mp.messaging.incoming.apikey-revocaciones-in.enable.auto.commit=false
mp.messaging.incoming.apikey-revocaciones-in.failure-strategy=ignore

# -----------------------------------------------------------------------------
# Descuento de inventario. true: al crear una FACTURA con ítems de inventario, la saga reserva el stock antes de
# firmar, lo confirma (kardex) al autorizar el SRI y lo libera si se rechaza; si no hay stock el comprobante queda en
# STOCK_INSUFICIENTE. false: la saga no usa inventario (comportamiento anterior). Se evalúa al crear cada saga: las
# que ya están en curso terminan con el modo con el que empezaron.
# -----------------------------------------------------------------------------
orquestacion.inventario.descuento.habilitado=${INVENTARIO_DESCUENTO_HABILITADO:true}

mp.messaging.outgoing.inventario-commands-out.connector=smallrye-kafka
mp.messaging.outgoing.inventario-commands-out.topic=facturacion.inventario.comandos.v1
mp.messaging.outgoing.inventario-commands-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.inventario-commands-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.inventario-commands-out.acks=all
mp.messaging.outgoing.inventario-commands-out.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:25000}
mp.messaging.outgoing.inventario-commands-out.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:10000}
mp.messaging.outgoing.inventario-commands-out.enable.idempotence=true

mp.messaging.incoming.inventario-events-in.connector=smallrye-kafka
mp.messaging.incoming.inventario-events-in.topic=facturacion.inventario.eventos.v1
mp.messaging.incoming.inventario-events-in.group.id=facturacion-orchestrator
mp.messaging.incoming.inventario-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.inventario-events-in.value.deserializer=com.facturacion.orquestacion.infrastructure.messaging.consumer.StockEventMessageDeserializer
mp.messaging.incoming.inventario-events-in.auto.offset.reset=earliest
mp.messaging.incoming.inventario-events-in.enable.auto.commit=false
mp.messaging.incoming.inventario-events-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.inventario-events-in.dead-letter-queue.topic=facturacion.inventario.eventos.v1.dlq

# =============================================================================
# TIMEOUTS — nada espera para siempre.
# Base de datos: se envían a Postgres como parámetros de cada conexión nueva. Una sentencia no pasa de statement_timeout,
# esperar un bloqueo (p. ej. el secuencial de un punto de emisión) no pasa de lock_timeout y una transacción abierta e
# inactiva (esperando algo externo) se cancela a los idle_in_transaction_session_timeout y suelta su conexión.
# Flyway usa JDBC y no se ve afectado. Las conexiones del pool se renuevan solas.
# Productores de Kafka: delivery.timeout.ms (arriba, por canal) es menor que el plazo de espera del relay del outbox
# (outbox.relay.timeout-ack): el cliente se da por vencido antes de que el relay suelte la transacción.
# Apagado: al recibir SIGTERM se esperan las peticiones en curso hasta este plazo (compose: stop_grace_period mayor).
# =============================================================================
quarkus.datasource.reactive.additional-properties.application_name=facturacion-orchestrator-service
quarkus.datasource.reactive.additional-properties.statement_timeout=${DB_STATEMENT_TIMEOUT:30s}
quarkus.datasource.reactive.additional-properties.lock_timeout=${DB_LOCK_TIMEOUT:10s}
quarkus.datasource.reactive.additional-properties.idle_in_transaction_session_timeout=${DB_IDLE_EN_TRANSACCION_TIMEOUT:60s}
quarkus.datasource.reactive.idle-timeout=PT10M
quarkus.datasource.reactive.max-lifetime=PT30M
quarkus.shutdown.timeout=${SHUTDOWN_TIMEOUT:PT30S}

# Outbox: plazo para el ack de Kafka (pasado el cual el relay suelta la transacción y reintenta en el siguiente ciclo) y
# espera inicial para que los emitters de Reactive Messaging estén conectados antes del primer ciclo.
outbox.relay.timeout-ack=${OUTBOX_TIMEOUT_ACK:PT30S}
outbox.relay.inicio-diferido=${OUTBOX_INICIO_DIFERIDO:15s}

# =============================================================================
# LOGS EN JSON (bandera LOG_FORMATO_JSON=true): una línea JSON por log, para que Loki/Grafana filtren por nivel y por
# campo. Apagado, los logs salen en texto legible (desarrollo).
# =============================================================================
quarkus.log.console.json.enabled=${LOG_FORMATO_JSON:false}
quarkus.log.console.json.additional-field.servicio.value=facturacion-orchestrator-service
