mp.messaging.incoming.sri-events-in.connector=smallrye-kafka
mp.messaging.incoming.sri-events-in.topic=facturacion.sri.eventos.v1
mp.messaging.incoming.sri-events-in.group.id=facturacion-orchestrator
mp.messaging.incoming.sri-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.sri-events-in.value.deserializer=com.facturacion.orquestacion.infrastructure.messaging.consumer.SriResultadoEventMessageDeserializer
mp.messaging.incoming.sri-events-in.auto.offset.reset=earliest
