# =============================================================================
# DATASOURCE — Postgres, esquema "orquestacion" dentro de la base de datos compartida "facturacion"
# =============================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${ORQUESTACION_DB_USER:orquestacion_service}
quarkus.datasource.password=${ORQUESTACION_DB_PASSWORD}
quarkus.datasource.reactive.url=${ORQUESTACION_DB_REACTIVE_URL:postgresql://localhost:5434/facturacion}
%dev.quarkus.datasource.reactive.max-size=10
%prod.quarkus.datasource.reactive.max-size=20
quarkus.datasource.jdbc.url=${ORQUESTACION_DB_JDBC_URL:jdbc:postgresql://localhost:5434/facturacion}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.default-schema=orquestacion
quarkus.flyway.schemas=orquestacion

# =============================================================================
# SERVIDOR HTTP
# =============================================================================
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.root-path=/sagas/api/v1
quarkus.http.cors.enabled=true
quarkus.http.cors.methods=GET,POST
quarkus.http.cors.headers=Content-Type,Authorization

# =============================================================================
# SWAGGER UI — botón "Authorize" para probar endpoints protegidos por api-key
# desde la propia UI (ver infrastructure.security.ApiKeyAuthFilter).
# =============================================================================
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=api-key
quarkus.smallrye-openapi.security-scheme-description=Api-key JWT emitida por identidad-service (POST /api-keys) — pegar solo el token, sin la palabra "Bearer".
mp.openapi.filter=com.facturacion.commons.security.SecurityRequirementOpenApiFilter

# =============================================================================
# API-KEY — mismo secreto HS256 que identidad-service, verificado
# localmente por ApiKeyAuthFilter sin llamada de red (ver ARQUITECTURA.md).
# =============================================================================
identidad.jwt.secreto=${IDENTIDAD_JWT_SECRET}

# =============================================================================
# KAFKA — la única pieza que conoce los 4 dominios a la vez (comprobante,
# firma, sri, notificacion). Ver MessagingConstants para el mapa completo.
# =============================================================================
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

# --- Entrantes ---
mp.messaging.incoming.comprobante-events-in.connector=smallrye-kafka
mp.messaging.incoming.comprobante-events-in.topic=facturacion.comprobante.eventos.v1
mp.messaging.incoming.comprobante-events-in.group.id=facturacion-orchestrator
mp.messaging.incoming.comprobante-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.comprobante-events-in.value.deserializer=com.facturacion.orquestacion.infrastructure.messaging.consumer.ComprobanteEventMessageDeserializer
mp.messaging.incoming.comprobante-events-in.auto.offset.reset=earliest
mp.messaging.incoming.comprobante-events-in.enable.auto.commit=false
mp.messaging.incoming.comprobante-events-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.comprobante-events-in.dead-letter-queue.topic=facturacion.comprobante.eventos.v1.dlq

mp.messaging.incoming.firma-events-in.connector=smallrye-kafka
mp.messaging.incoming.firma-events-in.topic=facturacion.firma.eventos.v1
mp.messaging.incoming.firma-events-in.group.id=facturacion-orchestrator
mp.messaging.incoming.firma-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.firma-events-in.value.deserializer=com.facturacion.orquestacion.infrastructure.messaging.consumer.ComprobanteFirmadoEventMessageDeserializer
mp.messaging.incoming.firma-events-in.auto.offset.reset=earliest
mp.messaging.incoming.firma-events-in.enable.auto.commit=false
mp.messaging.incoming.firma-events-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.firma-events-in.dead-letter-queue.topic=facturacion.firma.eventos.v1.dlq

mp.messaging.incoming.sri-events-in.connector=smallrye-kafka
mp.messaging.incoming.sri-events-in.topic=facturacion.sri.eventos.v1
mp.messaging.incoming.sri-events-in.group.id=facturacion-orchestrator
mp.messaging.incoming.sri-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.sri-events-in.value.deserializer=com.facturacion.orquestacion.infrastructure.messaging.consumer.SriResultadoEventMessageDeserializer
mp.messaging.incoming.sri-events-in.auto.offset.reset=earliest
mp.messaging.incoming.sri-events-in.enable.auto.commit=false
mp.messaging.incoming.sri-events-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.sri-events-in.dead-letter-queue.topic=facturacion.sri.eventos.v1.dlq

mp.messaging.incoming.notificacion-events-in.connector=smallrye-kafka
mp.messaging.incoming.notificacion-events-in.topic=facturacion.notificacion.eventos.v1
mp.messaging.incoming.notificacion-events-in.group.id=facturacion-orchestrator
mp.messaging.incoming.notificacion-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.notificacion-events-in.value.deserializer=com.facturacion.orquestacion.infrastructure.messaging.consumer.NotificacionResultadoEventMessageDeserializer
mp.messaging.incoming.notificacion-events-in.auto.offset.reset=earliest
mp.messaging.incoming.notificacion-events-in.enable.auto.commit=false
mp.messaging.incoming.notificacion-events-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.notificacion-events-in.dead-letter-queue.topic=facturacion.notificacion.eventos.v1.dlq

# --- Salientes: los tres tópicos de comandos (comprobante, firma, sri) ---
mp.messaging.outgoing.comprobante-commands-out.connector=smallrye-kafka
mp.messaging.outgoing.comprobante-commands-out.topic=facturacion.comprobante.comandos.v1
mp.messaging.outgoing.comprobante-commands-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.comprobante-commands-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.comprobante-commands-out.acks=all
mp.messaging.outgoing.comprobante-commands-out.enable.idempotence=true

mp.messaging.outgoing.firma-commands-out.connector=smallrye-kafka
mp.messaging.outgoing.firma-commands-out.topic=facturacion.firma.comandos.v1
mp.messaging.outgoing.firma-commands-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.firma-commands-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.firma-commands-out.acks=all
mp.messaging.outgoing.firma-commands-out.enable.idempotence=true

mp.messaging.outgoing.sri-commands-out.connector=smallrye-kafka
mp.messaging.outgoing.sri-commands-out.topic=facturacion.sri.comandos.v1
mp.messaging.outgoing.sri-commands-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.sri-commands-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.sri-commands-out.acks=all
mp.messaging.outgoing.sri-commands-out.enable.idempotence=true

# =============================================================================
# OPENAPI / SWAGGER
# =============================================================================
mp.openapi.scan.disable=false
quarkus.swagger-ui.always-include=true

# =============================================================================
# LOGS
# =============================================================================
quarkus.log.level=INFO

# =============================================================================
# PRUEBAS
# =============================================================================
quarkus.test.continuous-testing=disabled

# Watchdog de sagas atascadas (SagaWatchdog): si una saga espera la respuesta de otro servicio más del plazo de su
# estado, se vuelve a publicar su último comando; tras max-reintentos pasa a EXPIRADA.
saga.watchdog.habilitado=${SAGA_WATCHDOG_HABILITADO:true}
saga.watchdog.intervalo=${SAGA_WATCHDOG_INTERVALO:30s}
saga.watchdog.plazo-firma=${SAGA_WATCHDOG_PLAZO_FIRMA:PT2M}
saga.watchdog.plazo-sri=${SAGA_WATCHDOG_PLAZO_SRI:PT15M}
saga.watchdog.max-reintentos=${SAGA_WATCHDOG_MAX_REINTENTOS:3}
