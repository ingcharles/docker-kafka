# =============================================================================
# DATASOURCE — Postgres, esquema "inventario" dentro de la base de datos compartida "facturacion"
# =============================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${INVENTARIO_DB_USER:inventario_service}
quarkus.datasource.password=${INVENTARIO_DB_PASSWORD}
quarkus.datasource.reactive.url=${INVENTARIO_DB_REACTIVE_URL:postgresql://localhost:5434/facturacion}
%dev.quarkus.datasource.reactive.max-size=10
%prod.quarkus.datasource.reactive.max-size=20
quarkus.datasource.jdbc.url=${INVENTARIO_DB_JDBC_URL:jdbc:postgresql://localhost:5434/facturacion}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.default-schema=inventario
quarkus.flyway.schemas=inventario

# =============================================================================
# SERVIDOR HTTP
# =============================================================================
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.root-path=/inventario/api/v1
# CORS: solo los orígenes de CORS_ORIGINS (separados por coma, sin comodín) y solo los métodos que este
# servicio realmente expone. En producción CORS_ORIGINS es obligatorio: sin él el servicio no arranca.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
%prod.quarkus.http.cors.origins=${CORS_ORIGINS}
quarkus.http.cors.methods=GET,POST,PUT,DELETE
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.exposed-headers=Location
quarkus.http.cors.access-control-max-age=PT1H
quarkus.http.cors.access-control-allow-credentials=false

# =============================================================================
# SWAGGER UI — botón "Authorize" para probar endpoints protegidos por api-key
# desde la propia UI (ver infrastructure.security.ApiKeyAuthFilter).
# =============================================================================
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=api-key
quarkus.smallrye-openapi.security-scheme-description=Api-key JWT emitida por identidad-service (POST /api-keys) — pegar solo el token, sin la palabra "Bearer".
mp.openapi.filter=com.facturacion.commons.security.SecurityRequirementOpenApiFilter

# =============================================================================
# API-KEY — mismo secreto HS256 que identidad-service, verificado
# localmente por ApiKeyAuthFilter sin llamada de red (ver ARQUITECTURA.md).
# =============================================================================
identidad.jwt.clave-publica=${IDENTIDAD_JWT_CLAVE_PUBLICA}
# Las imágenes de ítems pueden superar el límite por defecto (10M) si son varias
# a la vez; el límite por archivo real se valida en ImagenService (ver TAMANO_MAXIMO_BYTES).
quarkus.http.limits.max-body-size=12M

# =============================================================================
# KAFKA — eventos salientes de stock/kardex, comandos entrantes de reserva
# =============================================================================
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

mp.messaging.outgoing.inventario-events-out.connector=smallrye-kafka
mp.messaging.outgoing.inventario-events-out.topic=facturacion.inventario.eventos.v1
mp.messaging.outgoing.inventario-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.inventario-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.inventario-events-out.acks=all
mp.messaging.outgoing.inventario-events-out.enable.idempotence=true

mp.messaging.outgoing.item-events-out.connector=smallrye-kafka
mp.messaging.outgoing.item-events-out.topic=facturacion.inventario.item.eventos.v1
mp.messaging.outgoing.item-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.item-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.item-events-out.acks=all
mp.messaging.outgoing.item-events-out.enable.idempotence=true

mp.messaging.incoming.inventario-comandos-in.connector=smallrye-kafka
mp.messaging.incoming.inventario-comandos-in.topic=facturacion.inventario.comandos.v1
mp.messaging.incoming.inventario-comandos-in.group.id=inventario-service
mp.messaging.incoming.inventario-comandos-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.inventario-comandos-in.value.deserializer=com.facturacion.inventario.infrastructure.messaging.consumer.StockCommandMessageDeserializer
mp.messaging.incoming.inventario-comandos-in.auto.offset.reset=earliest
mp.messaging.incoming.inventario-comandos-in.enable.auto.commit=false
mp.messaging.incoming.inventario-comandos-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.inventario-comandos-in.dead-letter-queue.topic=facturacion.inventario.comandos.v1.dlq

# =============================================================================
# OPENAPI / SWAGGER
# =============================================================================
mp.openapi.scan.disable=false
# Swagger UI y el documento OpenAPI solo existen en desarrollo y pruebas (quarkus:dev, tests): en producción publicarían
# el mapa completo de la API. Para tenerlos en una imagen concreta, compilar con -Dquarkus.swagger-ui.always-include=true.
%prod.quarkus.smallrye-openapi.enable=false

# =============================================================================
# LOGS
# =============================================================================
quarkus.log.level=INFO

# =============================================================================
# PRUEBAS
# =============================================================================
quarkus.test.continuous-testing=disabled

# -----------------------------------------------------------------------------
# Revocación de api-keys (publicada por identidad-service). Cada instancia usa
# un group.id propio y relee el tópico desde el inicio al arrancar: la lista de
# revocadas vive en memoria (RevocacionApiKeys, facturacion-commons).
# -----------------------------------------------------------------------------
mp.messaging.incoming.apikey-revocaciones-in.connector=smallrye-kafka
mp.messaging.incoming.apikey-revocaciones-in.topic=facturacion.apikey.revocaciones.v1
mp.messaging.incoming.apikey-revocaciones-in.group.id=${quarkus.uuid}
mp.messaging.incoming.apikey-revocaciones-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.apikey-revocaciones-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.apikey-revocaciones-in.auto.offset.reset=earliest
mp.messaging.incoming.apikey-revocaciones-in.enable.auto.commit=false
mp.messaging.incoming.apikey-revocaciones-in.failure-strategy=ignore
