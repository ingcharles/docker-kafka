# Loki en un solo proceso (suficiente para este volumen): guarda los logs en disco y los borra a los 14 días.
# Los logs de facturación llevan código y solo ids (nada de cédulas, correos ni claves), así que se pueden guardar.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  retention_period: 336h
  allow_structured_metadata: true
  volume_enabled: true

analytics:
  reporting_enabled: false
