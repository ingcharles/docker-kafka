# =============================================================================
# DATASOURCE — Postgres, esquema "identidad" dentro de la base de datos compartida "facturacion"
# =============================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${IDENTIDAD_DB_USER:identidad_service}
quarkus.datasource.password=${IDENTIDAD_DB_PASSWORD}
quarkus.datasource.reactive.url=${IDENTIDAD_DB_REACTIVE_URL:postgresql://localhost:5434/facturacion}
%dev.quarkus.datasource.reactive.max-size=10
%prod.quarkus.datasource.reactive.max-size=20
quarkus.datasource.jdbc.url=${IDENTIDAD_DB_JDBC_URL:jdbc:postgresql://localhost:5434/facturacion}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.default-schema=identidad
quarkus.flyway.schemas=identidad

# =============================================================================
# SERVIDOR HTTP — este servicio no participa en la saga de emisión (ver
# ARQUITECTURA.md sección 2), pero sí consume Kafka (ver más abajo) para
# mantener una copia local de qué rucs tienen un Empresa real. Los demás
# servicios verifican los JWT que este servicio emite localmente con el
# mismo secreto (IDENTIDAD_JWT_SECRET), sin llamada de red.
# =============================================================================
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.root-path=/identidad/api/v1
quarkus.http.cors.enabled=true
quarkus.http.cors.methods=GET,POST,DELETE
quarkus.http.cors.headers=Content-Type,Authorization

# =============================================================================
# SWAGGER UI — botón "Authorize" para probar endpoints protegidos (api-key de
# otro servicio no aplica aquí, pero sí el token de sesión propio).
# =============================================================================
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=token
quarkus.smallrye-openapi.security-scheme-description=Token de sesión (POST /usuarios/login) o api-key (POST /api-keys) — pegar solo el token, sin la palabra "Bearer".

# =============================================================================
# JWT — secreto HMAC compartido con el resto del ecosistema.
# =============================================================================
identidad.jwt.secreto=${IDENTIDAD_JWT_SECRET}
# Duración del token de sesión (login) — corta, es solo para autenticarse
# frente a este servicio y crear/listar api-keys, no para llamar a los
# demás servicios.
identidad.jwt.sesion.duracion-horas=8
# Tope de expiración de una api-key en días, aunque el caller pida más —
# evita api-keys "eternas" por error de quien la crea.
identidad.jwt.apikey.max-dias=365

# =============================================================================
# KAFKA — solo entrante: copia local de qué rucs tienen un Empresa real y
# activo en firma-electronica-service (ver EmpresaEventConsumer/EmpresaLocal),
# usada para validar POST /usuarios/me/empresas. Este servicio no publica
# nada a Kafka.
# =============================================================================
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

mp.messaging.incoming.empresa-events-in.connector=smallrye-kafka
mp.messaging.incoming.empresa-events-in.topic=facturacion.empresa.eventos.v1
mp.messaging.incoming.empresa-events-in.group.id=identidad-service
mp.messaging.incoming.empresa-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.empresa-events-in.value.deserializer=com.facturacion.identidad.infrastructure.messaging.consumer.EmpresaEventMessageDeserializer
mp.messaging.incoming.empresa-events-in.auto.offset.reset=earliest
mp.messaging.incoming.empresa-events-in.enable.auto.commit=false
mp.messaging.incoming.empresa-events-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.empresa-events-in.dead-letter-queue.topic=facturacion.empresa.eventos.v1.dlq

mp.messaging.incoming.establecimiento-punto-emision-events-in.connector=smallrye-kafka
mp.messaging.incoming.establecimiento-punto-emision-events-in.topic=facturacion.empresa.establecimientos.eventos.v1
mp.messaging.incoming.establecimiento-punto-emision-events-in.group.id=identidad-service
mp.messaging.incoming.establecimiento-punto-emision-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.establecimiento-punto-emision-events-in.value.deserializer=com.facturacion.identidad.infrastructure.messaging.consumer.EstablecimientoPuntoEmisionEventMessageDeserializer
mp.messaging.incoming.establecimiento-punto-emision-events-in.auto.offset.reset=earliest
mp.messaging.incoming.establecimiento-punto-emision-events-in.enable.auto.commit=false
mp.messaging.incoming.establecimiento-punto-emision-events-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.establecimiento-punto-emision-events-in.dead-letter-queue.topic=facturacion.empresa.establecimientos.eventos.v1.dlq

# =============================================================================
# OPENAPI / SWAGGER
# =============================================================================
mp.openapi.scan.disable=false
quarkus.swagger-ui.always-include=true

# =============================================================================
# LOGS
# =============================================================================
quarkus.log.level=INFO

# =============================================================================
# PRUEBAS
# =============================================================================
quarkus.test.continuous-testing=disabled
