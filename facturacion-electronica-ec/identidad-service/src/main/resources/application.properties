# =============================================================================
# DATASOURCE — Postgres, esquema "identidad" dentro de la base de datos compartida "facturacion"
# =============================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${IDENTIDAD_DB_USER:identidad_service}
quarkus.datasource.password=${IDENTIDAD_DB_PASSWORD}
quarkus.datasource.reactive.url=${IDENTIDAD_DB_REACTIVE_URL:postgresql://localhost:5434/facturacion}
%dev.quarkus.datasource.reactive.max-size=10
%prod.quarkus.datasource.reactive.max-size=20
quarkus.datasource.jdbc.url=${IDENTIDAD_DB_JDBC_URL:jdbc:postgresql://localhost:5434/facturacion}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.default-schema=identidad
quarkus.flyway.schemas=identidad

# =============================================================================
# SERVIDOR HTTP — este servicio no participa en la saga de emisión (ver
# ARQUITECTURA.md sección 2), pero sí consume Kafka (ver más abajo) para
# mantener una copia local de qué rucs tienen un Empresa real. Los demás
# servicios verifican los JWT que este servicio emite localmente con el
# la llave pública de identidad (IDENTIDAD_JWT_CLAVE_PUBLICA), sin llamada de red.
# =============================================================================
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.root-path=/identidad/api/v1
# CORS: solo los orígenes de CORS_ORIGINS (separados por coma, sin comodín) y solo los métodos que este
# servicio realmente expone. En producción CORS_ORIGINS es obligatorio: sin él el servicio no arranca.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
%prod.quarkus.http.cors.origins=${CORS_ORIGINS}
quarkus.http.cors.methods=GET,POST,PATCH,DELETE
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.exposed-headers=Location
quarkus.http.cors.access-control-max-age=PT1H
quarkus.http.cors.access-control-allow-credentials=false

# =============================================================================
# SWAGGER UI — botón "Authorize" para probar endpoints protegidos (api-key de
# otro servicio no aplica aquí, pero sí el token de sesión propio).
# =============================================================================
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=token
quarkus.smallrye-openapi.security-scheme-description=Token de sesión (POST /usuarios/login) o api-key (POST /api-keys) — pegar solo el token, sin la palabra "Bearer".

# =============================================================================
# JWT — secreto HMAC compartido con el resto del ecosistema.
# =============================================================================
# Llave PRIVADA con la que se firman los JWT: solo existe en este servicio (Ed25519 o RSA, PKCS#8 en PEM).
identidad.jwt.clave-privada=${IDENTIDAD_JWT_CLAVE_PRIVADA}
# Llave pública (la misma que reciben los demás servicios) para validar los tokens de sesión propios.
identidad.jwt.clave-publica=${IDENTIDAD_JWT_CLAVE_PUBLICA}
# Duración del token de sesión (login) — corta, es solo para autenticarse
# frente a este servicio y crear/listar api-keys, no para llamar a los
# demás servicios.
identidad.jwt.sesion.duracion-horas=8
# Tope de expiración de una api-key en días, aunque el caller pida más —
# evita api-keys "eternas" por error de quien la crea.
identidad.jwt.apikey.max-dias=365

# =============================================================================
# KAFKA — entrante: copia local de qué rucs tienen un Empresa real y
# activo en firma-electronica-service (ver EmpresaEventConsumer/EmpresaLocal),
# usada por EmpresaEventConsumer (otorga ADMIN al creador de la empresa). Publica solo
# las revocaciones de api-keys (apikey-revocaciones-out).
# =============================================================================
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

mp.messaging.incoming.empresa-events-in.connector=smallrye-kafka
mp.messaging.incoming.empresa-events-in.topic=facturacion.empresa.eventos.v1
mp.messaging.incoming.empresa-events-in.group.id=identidad-service
mp.messaging.incoming.empresa-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.empresa-events-in.value.deserializer=com.facturacion.identidad.infrastructure.messaging.consumer.EmpresaEventMessageDeserializer
mp.messaging.incoming.empresa-events-in.auto.offset.reset=earliest
mp.messaging.incoming.empresa-events-in.enable.auto.commit=false
mp.messaging.incoming.empresa-events-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.empresa-events-in.dead-letter-queue.topic=facturacion.empresa.eventos.v1.dlq

mp.messaging.incoming.establecimiento-punto-emision-events-in.connector=smallrye-kafka
mp.messaging.incoming.establecimiento-punto-emision-events-in.topic=facturacion.empresa.establecimientos.eventos.v1
mp.messaging.incoming.establecimiento-punto-emision-events-in.group.id=identidad-service
mp.messaging.incoming.establecimiento-punto-emision-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.establecimiento-punto-emision-events-in.value.deserializer=com.facturacion.identidad.infrastructure.messaging.consumer.EstablecimientoPuntoEmisionEventMessageDeserializer
mp.messaging.incoming.establecimiento-punto-emision-events-in.auto.offset.reset=earliest
mp.messaging.incoming.establecimiento-punto-emision-events-in.enable.auto.commit=false
mp.messaging.incoming.establecimiento-punto-emision-events-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.establecimiento-punto-emision-events-in.dead-letter-queue.topic=facturacion.empresa.establecimientos.eventos.v1.dlq

# =============================================================================
# OPENAPI / SWAGGER
# =============================================================================
mp.openapi.scan.disable=false
# Swagger UI y el documento OpenAPI solo existen en desarrollo y pruebas (quarkus:dev, tests): en producción publicarían
# el mapa completo de la API. Para tenerlos en una imagen concreta, compilar con -Dquarkus.swagger-ui.always-include=true.
%prod.quarkus.smallrye-openapi.enabled=false

# =============================================================================
# LOGS
# =============================================================================
quarkus.log.level=INFO
# Vert.x crea un pool de Postgres por event loop y Micrometer avisa (una vez por servicio) que el gauge postgresql.queue.size ya estaba registrado;
# es inofensivo (el contador y los demás medidores se suman bien), por eso solo se muestran los errores de ese registro.
quarkus.log.category."io.micrometer.core.instrument.MeterRegistry".level=ERROR

# =============================================================================
# PRUEBAS
# =============================================================================
quarkus.test.continuous-testing=disabled

# -----------------------------------------------------------------------------
# Revocación de api-keys: identidad publica cada revocación y todos los
# servicios (incluido este) la cargan en memoria (RevocacionApiKeys). Ver
# ARQUITECTURA.md "Revocación de api-keys".
# -----------------------------------------------------------------------------
mp.messaging.outgoing.apikey-revocaciones-out.connector=smallrye-kafka
mp.messaging.outgoing.apikey-revocaciones-out.topic=facturacion.apikey.revocaciones.v1
mp.messaging.outgoing.apikey-revocaciones-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.apikey-revocaciones-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.apikey-revocaciones-out.acks=all
mp.messaging.outgoing.apikey-revocaciones-out.enable.idempotence=true
mp.messaging.outgoing.apikey-revocaciones-out.delivery.timeout.ms=${KAFKA_REVOCACIONES_DELIVERY_TIMEOUT_MS:8000}
mp.messaging.outgoing.apikey-revocaciones-out.request.timeout.ms=${KAFKA_REVOCACIONES_REQUEST_TIMEOUT_MS:5000}

# -----------------------------------------------------------------------------
# Revocación de api-keys (publicada por identidad-service). Cada instancia usa
# un group.id propio y relee el tópico desde el inicio al arrancar: la lista de
# revocadas vive en memoria (RevocacionApiKeys, facturacion-commons).
# -----------------------------------------------------------------------------
mp.messaging.incoming.apikey-revocaciones-in.connector=smallrye-kafka
mp.messaging.incoming.apikey-revocaciones-in.topic=facturacion.apikey.revocaciones.v1
mp.messaging.incoming.apikey-revocaciones-in.group.id=${quarkus.uuid}
mp.messaging.incoming.apikey-revocaciones-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.apikey-revocaciones-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.apikey-revocaciones-in.auto.offset.reset=earliest
mp.messaging.incoming.apikey-revocaciones-in.enable.auto.commit=false
mp.messaging.incoming.apikey-revocaciones-in.failure-strategy=ignore

# identidad tiene endpoints públicos (registro y login) y su propia autenticación de sesión: el filtro global de
# api-key de facturacion-commons no debe aplicarse aquí.
facturacion.filtro-api-key.habilitado=false

# =============================================================================
# BCRYPT — es CPU-bound: corre en un ejecutor propio y acotado (no en el worker pool compartido) para que una
# ráfaga de logins no agote los hilos del resto del servicio. Con todos ocupados y la cola llena responde 429.
# =============================================================================
identidad.password.hilos=${IDENTIDAD_PASSWORD_HILOS:4}
identidad.password.cola=${IDENTIDAD_PASSWORD_COLA:100}

# =============================================================================
# TIMEOUTS — nada espera para siempre.
# Base de datos: se envían a Postgres como parámetros de cada conexión nueva. Una sentencia no pasa de statement_timeout,
# esperar un bloqueo (p. ej. el secuencial de un punto de emisión) no pasa de lock_timeout y una transacción abierta e
# inactiva (esperando algo externo) se cancela a los idle_in_transaction_session_timeout y suelta su conexión.
# Flyway usa JDBC y no se ve afectado. Las conexiones del pool se renuevan solas.
# Productores de Kafka: delivery.timeout.ms (arriba, por canal) es menor que el plazo de espera del relay del outbox
# (outbox.relay.timeout-ack): el cliente se da por vencido antes de que el relay suelte la transacción.
# Apagado: al recibir SIGTERM se esperan las peticiones en curso hasta este plazo (compose: stop_grace_period mayor).
# =============================================================================
quarkus.datasource.reactive.additional-properties.application_name=identidad-service
quarkus.datasource.reactive.additional-properties.statement_timeout=${DB_STATEMENT_TIMEOUT:30s}
quarkus.datasource.reactive.additional-properties.lock_timeout=${DB_LOCK_TIMEOUT:10s}
quarkus.datasource.reactive.additional-properties.idle_in_transaction_session_timeout=${DB_IDLE_EN_TRANSACCION_TIMEOUT:60s}
quarkus.datasource.reactive.idle-timeout=PT10M
quarkus.datasource.reactive.max-lifetime=PT30M
quarkus.shutdown.timeout=${SHUTDOWN_TIMEOUT:PT30S}

# Revocación de api-keys: plazo para el ack de Kafka; pasado, la revocación falla y se revierte (el usuario reintenta).
identidad.revocaciones.timeout-ack=${REVOCACIONES_TIMEOUT_ACK:PT10S}

# =============================================================================
# LOGS EN JSON (bandera LOG_FORMATO_JSON=true): una línea JSON por log, para que Loki/Grafana filtren por nivel y por
# campo. Apagado, los logs salen en texto legible (desarrollo).
# =============================================================================
quarkus.log.console.json.enabled=${LOG_FORMATO_JSON:false}
quarkus.log.console.json.additional-field.servicio.value=identidad-service
