# Stack de facturación electrónica SRI Ecuador: los microservicios Quarkus y un
# job de bootstrap de tópicos. Necesita dos stacks externos ya levantados:
#   - Postgres: ../postgres (red `facturacion_net`, host `DB_HOST`, un esquema por servicio; se levanta con
#     ../postgres/compose.sh <ambiente> up -d --build).
#   - Kafka: el broker en ../kafka (red `kafka_net`).
# Se construye de forma incremental: los servicios se agregan aquí a medida
# que se van construyendo.
# Variables que comparten los servicios (plazos y formato de logs). Compose solo le pasa a un contenedor las variables que aparecen en su
# `environment`, así que cada plazo ajustable se declara aquí con su valor por defecto y se cambia en env/<ambiente>.env.
# Lista completa y qué hace cada una: documentacion/VARIABLES_DE_ENTORNO.md.
x-tiempos: &tiempos
  DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-30s}
  DB_LOCK_TIMEOUT: ${DB_LOCK_TIMEOUT:-10s}
  DB_IDLE_EN_TRANSACCION_TIMEOUT: ${DB_IDLE_EN_TRANSACCION_TIMEOUT:-60s}
  SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-PT30S}
  LOG_FORMATO_JSON: ${LOG_FORMATO_JSON:-false}
# Máquina virtual de Java: usa un porcentaje de la memoria del contenedor (no un -Xmx fijo) y, si se queda sin memoria, el proceso termina para que
# restart lo levante limpio en vez de quedar medio vivo. PDFBox guarda su caché de fuentes en /tmp porque el sistema de archivos es de solo lectura.
x-jvm: &jvm
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=${JVM_MAX_RAM_PORCENTAJE:-70} -XX:+ExitOnOutOfMemoryError -Dpdfbox.fontcache=/tmp ${JVM_OPCIONES_EXTRA:-}
# Endurecimiento y límites de cada microservicio. Sin un límite de memoria un servicio con fuga se come al servidor y se lleva a los demás;
# sin cap_drop y no-new-privileges un fallo de seguridad en la aplicación da más poder al atacante. Valores por ambiente: documentacion/VARIABLES_DE_ENTORNO.md.
x-contenedor: &contenedor
  restart: unless-stopped
  stop_grace_period: 45s
  init: true
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: ${CONTENEDOR_PIDS:-512}
  mem_limit: ${CONTENEDOR_MEMORIA:-1g}
  cpus: ${CONTENEDOR_CPUS:-2.0}
  logging:
    driver: json-file
    options:
      max-size: "${LOG_ROTACION_TAMANO:-10m}"
      max-file: "${LOG_ROTACION_ARCHIVOS:-5}"
x-productor-kafka: &productor-kafka
  KAFKA_DELIVERY_TIMEOUT_MS: ${KAFKA_DELIVERY_TIMEOUT_MS:-25000}
  KAFKA_REQUEST_TIMEOUT_MS: ${KAFKA_REQUEST_TIMEOUT_MS:-10000}
  OUTBOX_TIMEOUT_ACK: ${OUTBOX_TIMEOUT_ACK:-PT30S}
  OUTBOX_INICIO_DIFERIDO: ${OUTBOX_INICIO_DIFERIDO:-15s}

services:
  facturacion-topic-init:
    build:
      context: ../kafka/topic-init
    restart: "no"
      # Formato: nombre:particiones:replicación:configs. KAFKA_REPLICATION_FACTOR y KAFKA_MIN_ISR salen de env/<ambiente>.env
      # (1 y 1 con un solo broker; 3 y 2 con el clúster de ../kafka/docker-compose.ha.yml). Las DLQ se conservan más
      # tiempo que los eventos (KAFKA_DLQ_RETENCION_MS, 30 días) para poder reprocesarlas. El job vuelve a aplicar las
      # configs a los tópicos que ya existen; el factor de replicación de un tópico existente no cambia solo.
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-broker:9092}
      KAFKA_TOPICS: >-
        facturacion.empresa.eventos.v1:6:${KAFKA_REPLICATION_FACTOR:-1}:min.insync.replicas=${KAFKA_MIN_ISR:-1},
        facturacion.empresa.eventos.v1.dlq:3:${KAFKA_REPLICATION_FACTOR:-1}:min.insync.replicas=${KAFKA_MIN_ISR:-1};retention.ms=${KAFKA_DLQ_RETENCION_MS:-2592000000},
        facturacion.empresa.establecimientos.eventos.v1:6:${KAFKA_REPLICATION_FACTOR:-1}:min.insync.replicas=${KAFKA_MIN_ISR:-1},
        facturacion.empresa.establecimientos.eventos.v1.dlq:3:${KAFKA_REPLICATION_FACTOR:-1}:min.insync.replicas=${KAFKA_MIN_ISR:-1};retention.ms=${KAFKA_DLQ_RETENCION_MS:-2592000000},
        facturacion.empresa.configuracion.eventos.v1:6:${KAFKA_REPLICATION_FACTOR:-1}:min.insync.replicas=${KAFKA_MIN_ISR:-1},
        facturacion.empresa.configuracion.eventos.v1.dlq:3:${KAFKA_REPLICATION_FACTOR:-1}:min.insync.replicas=${KAFKA_MIN_ISR:-1};retention.ms=${KAFKA_DLQ_RETENCION_MS:-2592000000},
        facturacion.inventario.comandos.v1:6:${KAFKA_REPLICATION_FACTOR:-1}:min.insync.replicas=${KAFKA_MIN_ISR:-1},
        facturacion.inventario.comandos.v1.dlq:3:${KAFKA_REPLICATION_FACTOR:-1}:min.insync.replicas=${KAFKA_MIN_ISR:-1};retention.ms=${KAFKA_DLQ_RETENCION_MS:-2592000000},
        facturacion.inventario.eventos.v1:6:${KAFKA_REPLICATION_FACTOR:-1}:min.insync.replicas=${KAFKA_MIN_ISR:-1},
        facturacion.inventario.eventos.v1.dlq:3:${KAFKA_REPLICATION_FACTOR:-1}:min.insync.replicas=${KAFKA_MIN_ISR:-1};retention.ms=${KAFKA_DLQ_RETENCION_MS:-2592000000},
        facturacion.inventario.item.eventos.v1:6:${KAFKA_REPLICATION_FACTOR:-1}:min.insync.replicas=${KAFKA_MIN_ISR:-1},
        facturacion.inventario.item.eventos.v1.dlq:3:${KAFKA_REPLICATION_FACTOR:-1}:min.insync.replicas=${KAFKA_MIN_ISR:-1};retention.ms=${KAFKA_DLQ_RETENCION_MS:-2592000000},
        facturacion.comprobante.eventos.v1:6:${KAFKA_REPLICATION_FACTOR:-1}:min.insync.replicas=${KAFKA_MIN_ISR:-1},
        facturacion.comprobante.eventos.v1.dlq:3:${KAFKA_REPLICATION_FACTOR:-1}:min.insync.replicas=${KAFKA_MIN_ISR:-1};retention.ms=${KAFKA_DLQ_RETENCION_MS:-2592000000},
        facturacion.comprobante.comandos.v1:6:${KAFKA_REPLICATION_FACTOR:-1}:min.insync.replicas=${KAFKA_MIN_ISR:-1},
        facturacion.comprobante.comandos.v1.dlq:3:${KAFKA_REPLICATION_FACTOR:-1}:min.insync.replicas=${KAFKA_MIN_ISR:-1};retention.ms=${KAFKA_DLQ_RETENCION_MS:-2592000000},
        facturacion.firma.comandos.v1:6:${KAFKA_REPLICATION_FACTOR:-1}:min.insync.replicas=${KAFKA_MIN_ISR:-1},
        facturacion.firma.comandos.v1.dlq:3:${KAFKA_REPLICATION_FACTOR:-1}:min.insync.replicas=${KAFKA_MIN_ISR:-1};retention.ms=${KAFKA_DLQ_RETENCION_MS:-2592000000},
        facturacion.firma.eventos.v1:6:${KAFKA_REPLICATION_FACTOR:-1}:min.insync.replicas=${KAFKA_MIN_ISR:-1},
        facturacion.firma.eventos.v1.dlq:3:${KAFKA_REPLICATION_FACTOR:-1}:min.insync.replicas=${KAFKA_MIN_ISR:-1};retention.ms=${KAFKA_DLQ_RETENCION_MS:-2592000000},
        facturacion.sri.comandos.v1:6:${KAFKA_REPLICATION_FACTOR:-1}:min.insync.replicas=${KAFKA_MIN_ISR:-1},
        facturacion.sri.comandos.v1.dlq:3:${KAFKA_REPLICATION_FACTOR:-1}:min.insync.replicas=${KAFKA_MIN_ISR:-1};retention.ms=${KAFKA_DLQ_RETENCION_MS:-2592000000},
        facturacion.sri.eventos.v1:6:${KAFKA_REPLICATION_FACTOR:-1}:min.insync.replicas=${KAFKA_MIN_ISR:-1},
        facturacion.sri.eventos.v1.dlq:3:${KAFKA_REPLICATION_FACTOR:-1}:min.insync.replicas=${KAFKA_MIN_ISR:-1};retention.ms=${KAFKA_DLQ_RETENCION_MS:-2592000000},
        facturacion.notificacion.comandos.v1:6:${KAFKA_REPLICATION_FACTOR:-1}:min.insync.replicas=${KAFKA_MIN_ISR:-1},
        facturacion.notificacion.comandos.v1.dlq:3:${KAFKA_REPLICATION_FACTOR:-1}:min.insync.replicas=${KAFKA_MIN_ISR:-1};retention.ms=${KAFKA_DLQ_RETENCION_MS:-2592000000},
        facturacion.notificacion.eventos.v1:6:${KAFKA_REPLICATION_FACTOR:-1}:min.insync.replicas=${KAFKA_MIN_ISR:-1},
        facturacion.notificacion.eventos.v1.dlq:3:${KAFKA_REPLICATION_FACTOR:-1}:min.insync.replicas=${KAFKA_MIN_ISR:-1};retention.ms=${KAFKA_DLQ_RETENCION_MS:-2592000000},
        facturacion.orquestacion.eventos.v1:3:${KAFKA_REPLICATION_FACTOR:-1}:min.insync.replicas=${KAFKA_MIN_ISR:-1},
        facturacion.apikey.revocaciones.v1:1:${KAFKA_REPLICATION_FACTOR:-1}:cleanup.policy=compact;min.cleanable.dirty.ratio=0.1;min.insync.replicas=${KAFKA_MIN_ISR:-1}
    networks:
      - kafka_net_ext

  firma-electronica-service:
    build:
      context: .
      dockerfile: firma-electronica-service/Dockerfile
    <<: *contenedor
    depends_on:
      facturacion-topic-init:
        condition: service_completed_successfully
    environment:
      <<: [*tiempos, *productor-kafka, *jvm]
      FIRMA_DB_PASSWORD: ${FIRMA_DB_PASSWORD:?FIRMA_DB_PASSWORD is required}
      FIRMA_DB_REACTIVE_URL: postgresql://${DB_POOL_HOST:-${DB_HOST:-facturacion-db}}:${DB_POOL_PORT:-5432}/${POSTGRES_DB:-facturacion}
      FIRMA_DB_JDBC_URL: jdbc:postgresql://${DB_HOST:-facturacion-db}:5432/${POSTGRES_DB:-facturacion}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-broker:9092}
      FIRMA_CIFRADO_CLAVE_MAESTRA: ${FIRMA_CIFRADO_CLAVE_MAESTRA:?FIRMA_CIFRADO_CLAVE_MAESTRA is required}
      IDENTIDAD_JWT_CLAVE_PUBLICA: ${IDENTIDAD_JWT_CLAVE_PUBLICA:?IDENTIDAD_JWT_CLAVE_PUBLICA is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${FIRMA_SERVICE_PORT:-8091}:8080"
    networks:
      - facturacion_net
      - kafka_net_ext

  inventario-service:
    build:
      context: .
      dockerfile: inventario-service/Dockerfile
    <<: *contenedor
    depends_on:
      facturacion-topic-init:
        condition: service_completed_successfully
    environment:
      <<: [*tiempos, *productor-kafka, *jvm]
      INVENTARIO_DB_PASSWORD: ${INVENTARIO_DB_PASSWORD:?INVENTARIO_DB_PASSWORD is required}
      INVENTARIO_DB_REACTIVE_URL: postgresql://${DB_POOL_HOST:-${DB_HOST:-facturacion-db}}:${DB_POOL_PORT:-5432}/${POSTGRES_DB:-facturacion}
      INVENTARIO_DB_JDBC_URL: jdbc:postgresql://${DB_HOST:-facturacion-db}:5432/${POSTGRES_DB:-facturacion}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-broker:9092}
      IDENTIDAD_JWT_CLAVE_PUBLICA: ${IDENTIDAD_JWT_CLAVE_PUBLICA:?IDENTIDAD_JWT_CLAVE_PUBLICA is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${INVENTARIO_SERVICE_PORT:-8092}:8080"
    networks:
      - facturacion_net
      - kafka_net_ext

  comprobantes-service:
    build:
      context: .
      dockerfile: comprobantes-service/Dockerfile
    <<: *contenedor
    depends_on:
      facturacion-topic-init:
        condition: service_completed_successfully
    environment:
      <<: [*tiempos, *productor-kafka, *jvm]
      CONSUMIDOR_FINAL_MONTO_MAXIMO: ${CONSUMIDOR_FINAL_MONTO_MAXIMO:-50.00}
      CORREO_MAXIMO_DESTINATARIOS: ${CORREO_MAXIMO_DESTINATARIOS:-3}
      COMPROBANTES_IDEMPOTENCIA_OBLIGATORIA: ${COMPROBANTES_IDEMPOTENCIA_OBLIGATORIA:-false}
      COMPROBANTES_IDEMPOTENCIA_RETENCION: ${COMPROBANTES_IDEMPOTENCIA_RETENCION:-P7D}
      COMPROBANTES_IDEMPOTENCIA_PURGA_CADA: ${COMPROBANTES_IDEMPOTENCIA_PURGA_CADA:-1h}
      COMPROBANTES_DB_PASSWORD: ${COMPROBANTES_DB_PASSWORD:?COMPROBANTES_DB_PASSWORD is required}
      COMPROBANTES_DB_REACTIVE_URL: postgresql://${DB_POOL_HOST:-${DB_HOST:-facturacion-db}}:${DB_POOL_PORT:-5432}/${POSTGRES_DB:-facturacion}
      COMPROBANTES_DB_JDBC_URL: jdbc:postgresql://${DB_HOST:-facturacion-db}:5432/${POSTGRES_DB:-facturacion}
      # Token para MODIFICAR los catálogos del SRI por PUT /catalogos (son globales, no por empresa). Vacío = escritura deshabilitada.
      CATALOGOS_ADMIN_TOKEN: ${CATALOGOS_ADMIN_TOKEN:-}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-broker:9092}
      IDENTIDAD_JWT_CLAVE_PUBLICA: ${IDENTIDAD_JWT_CLAVE_PUBLICA:?IDENTIDAD_JWT_CLAVE_PUBLICA is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${COMPROBANTES_SERVICE_PORT:-8093}:8080"
    networks:
      - facturacion_net
      - kafka_net_ext

  sri-conector-service:
    build:
      context: .
      dockerfile: sri-conector-service/Dockerfile
    <<: *contenedor
    depends_on:
      facturacion-topic-init:
        condition: service_completed_successfully
    environment:
      <<: [*tiempos, *productor-kafka, *jvm]
      SRI_TIMEOUT_CONEXION: ${SRI_TIMEOUT_CONEXION:-PT10S}
      SRI_TIMEOUT_RESPUESTA: ${SRI_TIMEOUT_RESPUESTA:-PT30S}
      SRI_URL_HOSTS_PERMITIDOS: ${SRI_URL_HOSTS_PERMITIDOS:-*.sri.gob.ec}
      SRI_DB_PASSWORD: ${SRI_DB_PASSWORD:?SRI_DB_PASSWORD is required}
      SRI_DB_REACTIVE_URL: postgresql://${DB_POOL_HOST:-${DB_HOST:-facturacion-db}}:${DB_POOL_PORT:-5432}/${POSTGRES_DB:-facturacion}
      SRI_DB_JDBC_URL: jdbc:postgresql://${DB_HOST:-facturacion-db}:5432/${POSTGRES_DB:-facturacion}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-broker:9092}
      IDENTIDAD_JWT_CLAVE_PUBLICA: ${IDENTIDAD_JWT_CLAVE_PUBLICA:?IDENTIDAD_JWT_CLAVE_PUBLICA is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${SRI_SERVICE_PORT:-8094}:8080"
    networks:
      - facturacion_net
      - kafka_net_ext

  notificacion-service:
    build:
      context: .
      dockerfile: notificacion-service/Dockerfile
    <<: *contenedor
    depends_on:
      facturacion-topic-init:
        condition: service_completed_successfully
    environment:
      <<: [*tiempos, *productor-kafka, *jvm]
      CORREO_TIMEOUT: ${CORREO_TIMEOUT:-PT30S}
      NOTIFICACION_DB_PASSWORD: ${NOTIFICACION_DB_PASSWORD:?NOTIFICACION_DB_PASSWORD is required}
      NOTIFICACION_DB_REACTIVE_URL: postgresql://${DB_POOL_HOST:-${DB_HOST:-facturacion-db}}:${DB_POOL_PORT:-5432}/${POSTGRES_DB:-facturacion}
      NOTIFICACION_DB_JDBC_URL: jdbc:postgresql://${DB_HOST:-facturacion-db}:5432/${POSTGRES_DB:-facturacion}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-broker:9092}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME is required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
      IDENTIDAD_JWT_CLAVE_PUBLICA: ${IDENTIDAD_JWT_CLAVE_PUBLICA:?IDENTIDAD_JWT_CLAVE_PUBLICA is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${NOTIFICACION_SERVICE_PORT:-8095}:8080"
    networks:
      - facturacion_net
      - kafka_net_ext

  facturacion-orchestrator-service:
    build:
      context: .
      dockerfile: facturacion-orchestrator-service/Dockerfile
    <<: *contenedor
    depends_on:
      facturacion-topic-init:
        condition: service_completed_successfully
    environment:
      <<: [*tiempos, *productor-kafka, *jvm]
