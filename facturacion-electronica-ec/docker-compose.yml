      - kafka_net_ext

  identidad-service:
    build:
      context: .
      dockerfile: identidad-service/Dockerfile
    <<: *contenedor
    depends_on:
      facturacion-topic-init:
        condition: service_completed_successfully
    environment:
      <<: [*tiempos, *jvm]
      IDENTIDAD_PASSWORD_HILOS: ${IDENTIDAD_PASSWORD_HILOS:-4}
      IDENTIDAD_PASSWORD_COLA: ${IDENTIDAD_PASSWORD_COLA:-100}
      KAFKA_REVOCACIONES_DELIVERY_TIMEOUT_MS: ${KAFKA_REVOCACIONES_DELIVERY_TIMEOUT_MS:-8000}
      KAFKA_REVOCACIONES_REQUEST_TIMEOUT_MS: ${KAFKA_REVOCACIONES_REQUEST_TIMEOUT_MS:-5000}
      REVOCACIONES_TIMEOUT_ACK: ${REVOCACIONES_TIMEOUT_ACK:-PT10S}
      IDENTIDAD_DB_PASSWORD: ${IDENTIDAD_DB_PASSWORD:?IDENTIDAD_DB_PASSWORD is required}
      IDENTIDAD_DB_REACTIVE_URL: postgresql://${DB_POOL_HOST:-${DB_HOST:-facturacion-db}}:${DB_POOL_PORT:-5432}/${POSTGRES_DB:-facturacion}
      IDENTIDAD_DB_JDBC_URL: jdbc:postgresql://${DB_HOST:-facturacion-db}:5432/${POSTGRES_DB:-facturacion}
      IDENTIDAD_JWT_CLAVE_PRIVADA: ${IDENTIDAD_JWT_CLAVE_PRIVADA:?IDENTIDAD_JWT_CLAVE_PRIVADA is required}
      IDENTIDAD_JWT_CLAVE_PUBLICA: ${IDENTIDAD_JWT_CLAVE_PUBLICA:?IDENTIDAD_JWT_CLAVE_PUBLICA is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-broker:9092}
    ports:
      - "${IDENTIDAD_SERVICE_PORT:-8097}:8080"
    networks:
      - facturacion_net
      - kafka_net_ext

  # ===========================================================================
  # OBSERVABILIDAD — opcional. BANDERA: OBSERVABILIDAD_HABILITADA=true en env/<ambiente>.env (lo lee
  # scripts/compose.sh y activa el perfil "observabilidad"); sin la bandera estos contenedores no existen y los servicios
  # funcionan igual. Con docker compose directo: COMPOSE_PROFILES=observabilidad.
  # Qué hace cada uno y cómo se usa: observabilidad/README.md.
  # ===========================================================================
  prometheus:
    profiles: ["observabilidad"]
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENCION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./observabilidad/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "${OBSERVABILIDAD_BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - facturacion_net

  alertmanager:
    profiles: ["observabilidad"]
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    # La configuración se genera al arrancar con las variables ALERTAS_* (observabilidad/alertmanager/entrypoint.sh).
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    environment:
      ALERTAS_CORREO_HABILITADO: ${ALERTAS_CORREO_HABILITADO:-false}
      ALERTAS_CORREO_DESTINATARIOS: ${ALERTAS_CORREO_DESTINATARIOS:-}
      ALERTAS_CORREO_REMITENTE: ${ALERTAS_CORREO_REMITENTE:-}
      ALERTAS_SMTP_HOST: ${ALERTAS_SMTP_HOST:-}
      ALERTAS_SMTP_USUARIO: ${ALERTAS_SMTP_USUARIO:-}
      ALERTAS_SMTP_PASSWORD: ${ALERTAS_SMTP_PASSWORD:-}
      ALERTAS_SMTP_REQUIERE_TLS: ${ALERTAS_SMTP_REQUIERE_TLS:-true}
    volumes:
      - ./observabilidad/alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    ports:
      - "${OBSERVABILIDAD_BIND:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"
    networks:
      - facturacion_net

  grafana:
    profiles: ["observabilidad"]
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Sin esta clave Grafana usa la de fábrica (admin) y pide cambiarla al primer ingreso: define GRAFANA_ADMIN_PASSWORD
      # en env/<ambiente>.secretos.env.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observabilidad/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidad/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${OBSERVABILIDAD_BIND:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - facturacion_net

  loki:
    profiles: ["observabilidad"]
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observabilidad/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - facturacion_net

  alloy:
    profiles: ["observabilidad"]
    image: grafana/alloy:v1.5.1
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observabilidad/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - facturacion_net

  postgres-exporter:
    profiles: ["observabilidad"]
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    environment:
      # Rol de solo lectura "observabilidad": se crea con observabilidad/crear-rol-monitoreo.sql.
      DATA_SOURCE_NAME: postgresql://observabilidad:${OBSERVABILIDAD_DB_PASSWORD:-}@${DB_HOST:-facturacion-db}:5432/${POSTGRES_DB:-facturacion}?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yaml
    volumes:
      - ./observabilidad/postgres-exporter/queries.yaml:/etc/postgres-exporter/queries.yaml:ro
    networks:
      - facturacion_net

  kafka-exporter:
    profiles: ["observabilidad"]
    image: danielqsj/kafka-exporter:v1.8.0
    restart: unless-stopped
    # Basta apuntar a un broker: el exportador descubre los demás.
    command: ["--kafka.server=${KAFKA_EXPORTER_BROKER:-broker:9092}"]
    networks:
      - facturacion_net
      - kafka_net_ext

  # Solo en un servidor Linux (perfil "host", bandera OBSERVABILIDAD_HOST_HABILITADA=true): CPU, memoria, disco y
  # desfase del reloj del servidor, y recursos de cada contenedor.
  node-exporter:
    profiles: ["host"]
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - facturacion_net

  cadvisor:
    profiles: ["host"]
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - facturacion_net

networks:
  facturacion_net:
    external: true
    name: facturacion_net
  kafka_net_ext:
    external: true
    name: kafka_net

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
