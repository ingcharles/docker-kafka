      SAGA_WATCHDOG_INTERVALO: ${SAGA_WATCHDOG_INTERVALO:-30s}
      SAGA_WATCHDOG_MAX_REINTENTOS: ${SAGA_WATCHDOG_MAX_REINTENTOS:-3}
      SAGA_WATCHDOG_PLAZO_FIRMA: ${SAGA_WATCHDOG_PLAZO_FIRMA:-PT2M}
      SAGA_WATCHDOG_PLAZO_SRI: ${SAGA_WATCHDOG_PLAZO_SRI:-PT15M}
      ORQUESTACION_DB_PASSWORD: ${ORQUESTACION_DB_PASSWORD:?ORQUESTACION_DB_PASSWORD is required}
      INVENTARIO_DESCUENTO_HABILITADO: ${INVENTARIO_DESCUENTO_HABILITADO:-true}
      SAGA_REENVIO_NOTIFICACIONES_HABILITADO: ${SAGA_REENVIO_NOTIFICACIONES_HABILITADO:-false}
      SAGA_REENVIO_NOTIFICACIONES_INTERVALO: ${SAGA_REENVIO_NOTIFICACIONES_INTERVALO:-5m}
      SAGA_REENVIO_NOTIFICACIONES_LOTE: ${SAGA_REENVIO_NOTIFICACIONES_LOTE:-20}
      SAGA_REENVIO_NOTIFICACIONES_ESPERA_MINIMA: ${SAGA_REENVIO_NOTIFICACIONES_ESPERA_MINIMA:-PT15M}
      SAGA_REENVIO_NOTIFICACIONES_PLAZO_RESPUESTA: ${SAGA_REENVIO_NOTIFICACIONES_PLAZO_RESPUESTA:-PT10M}
      SAGA_REENVIO_NOTIFICACIONES_MAX_INTENTOS: ${SAGA_REENVIO_NOTIFICACIONES_MAX_INTENTOS:-3}
      ORQUESTACION_DB_REACTIVE_URL: postgresql://${DB_POOL_HOST:-${DB_HOST:-facturacion-db}}:${DB_POOL_PORT:-5432}/${POSTGRES_DB:-facturacion}
      ORQUESTACION_DB_JDBC_URL: jdbc:postgresql://${DB_HOST:-facturacion-db}:5432/${POSTGRES_DB:-facturacion}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-broker:9092}
      IDENTIDAD_JWT_CLAVE_PUBLICA: ${IDENTIDAD_JWT_CLAVE_PUBLICA:?IDENTIDAD_JWT_CLAVE_PUBLICA is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${ORQUESTACION_SERVICE_PORT:-8096}:8080"
    networks:
