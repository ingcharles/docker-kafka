# Operaciones con un límite propio en el gateway (ARQUITECTURA.md 10.1). Una línea por operación:
#
#   <servicio>  <VERBO>  <ruta o *>  <política>
#
# Políticas (sus límites por minuto salen de wso2/env/<ambiente>.env):
#   sensible   login, alta de usuarios, cambio de clave y creación de api-keys: frena la fuerza bruta (LIMITE_SENSIBLE_POR_MIN)
#   emision    emisión de comprobantes (LIMITE_EMISION_POR_MIN)
# "*" aplica a todas las rutas de ese servicio con ese verbo. El resto de operaciones solo tiene el límite de la suscripción.
identidad-service      POST   /usuarios/login          sensible
identidad-service      POST   /usuarios                sensible
identidad-service      PATCH  /usuarios/me/password    sensible
identidad-service      POST   /api-keys                sensible
comprobantes-service   POST   *                        emision
