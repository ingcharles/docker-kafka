# Kafka con réplicas, en modo KRaft (cada nodo es broker y controlador): 2 nodos en PRUEBAS y 3 en PRODUCCIÓN. El de un solo
# nodo (docker-compose.yml de esta carpeta) queda para desarrollo.
#
#   PRUEBAS (2 nodos, replicación 2, min ISR 2):
#     docker compose --env-file env/pruebas.env -f docker-compose.ha.yml up -d --build
#   PRODUCCIÓN (3 nodos, replicación 3, min ISR 2):
#     docker compose --env-file env/produccion.env -f docker-compose.ha.yml up -d --build
#
# Qué tolera cada uno (con acks=all en los productores):
#   - 3 nodos, min ISR 2: un nodo caído no frena nada ni pierde mensajes; dos caídos detienen las escrituras a propósito.
#   - 2 nodos, min ISR 2: todo mensaje confirmado está en los dos nodos (la misma garantía de durabilidad que producción),
#     pero con un nodo caído las escrituras se detienen: con 2 controladores no hay mayoría. Sirve para probar la
#     durabilidad y el comportamiento ante una caída, no para tolerarla.
# El nodo 3 solo existe con el perfil "tres-nodos" (env/produccion.env lo activa con COMPOSE_PROFILES).
#
# Los servicios se conectan con KAFKA_BOOTSTRAP_SERVERS y los tópicos se crean con KAFKA_REPLICATION_FACTOR y
# KAFKA_MIN_ISR (ver facturacion-electronica-ec/env/<ambiente>.env). Variables de este archivo: ver env/*.env.
x-broker-comun: &broker-comun
  build:
    context: ./broker
  restart: unless-stopped
  environment: &broker-env
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_QUORUM_VOTERS:-1@broker-1:9093,2@broker-2:9093,3@broker-3:9093}
    KAFKA_LOG_DIRS: /var/lib/kafka/data
    # El mismo cluster id en los tres nodos.
    CLUSTER_ID: "${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID is required, generate one with: docker run --rm apache/kafka:3.9.0 /opt/kafka/bin/kafka-storage.sh random-uuid}"
    # Replicación: todas las copias que diga KAFKA_REPLICATION_FACTOR (3 por defecto) y al menos KAFKA_MIN_ISR
    # (2 por defecto) sincronizadas para aceptar una escritura.
    KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-3}
    KAFKA_MIN_INSYNC_REPLICAS: ${KAFKA_MIN_ISR:-2}
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-3}
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-3}
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_MIN_ISR:-2}
    # Nunca elegir líder a una réplica desactualizada: se prefiere dejar de escribir antes que perder mensajes.
    KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_NUM_PARTITIONS: 6
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
    # Los eventos se conservan 7 días (las DLQ, más: ver KAFKA_TOPICS en facturacion-electronica-ec/docker-compose.yml).
    KAFKA_LOG_RETENTION_HOURS: 168
    KAFKA_HEAP_OPTS: "${KAFKA_HEAP_OPTS:--Xms512m -Xmx512m}"
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 30s
  networks:
    - kafka_net

services:
  broker-1:
    <<: *broker-comun
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker-1:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT_1:-9094}
    ports:
      - "${KAFKA_HOST_PORT_1:-9094}:9094"
    volumes:
      - kafka_data_1:/var/lib/kafka/data

  broker-2:
    <<: *broker-comun
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker-2:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT_2:-9095}
    ports:
      - "${KAFKA_HOST_PORT_2:-9095}:9094"
    volumes:
      - kafka_data_2:/var/lib/kafka/data

  broker-3:
    <<: *broker-comun
    profiles: ["tres-nodos"]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker-3:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT_3:-9096}
    ports:
      - "${KAFKA_HOST_PORT_3:-9096}:9094"
    volumes:
      - kafka_data_3:/var/lib/kafka/data

  topic-init:
    build:
      context: ./topic-init
    restart: "no"
    depends_on:
      broker-1:
        condition: service_healthy
      broker-2:
        condition: service_healthy
      broker-3:
        condition: service_healthy
        required: false
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-broker-1:9092,broker-2:9092,broker-3:9092}
      KAFKA_TOPICS: ${KAFKA_TOPICS:-example-topic:6:${KAFKA_REPLICATION_FACTOR:-3}:min.insync.replicas=${KAFKA_MIN_ISR:-2}}
    networks:
      - kafka_net

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    depends_on:
      broker-1:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_CLUSTER_NOMBRE:-cluster}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-broker-1:9092,broker-2:9092,broker-3:9092}
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    networks:
      - kafka_net

networks:
  kafka_net:
    # El nombre fijo permite que otros proyectos de Compose se conecten a esta red como externa. Para levantar este
    # clúster al lado del de un solo nodo (pruebas), cambia KAFKA_NETWORK.
    name: ${KAFKA_NETWORK:-kafka_net}
    driver: bridge

volumes:
  kafka_data_1:
  kafka_data_2:
  kafka_data_3:
