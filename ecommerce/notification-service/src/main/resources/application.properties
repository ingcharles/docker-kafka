# =============================================================================
# DATASOURCE — Postgres, esquema "notification" dentro de la base de datos compartida "ecommerce"
# =============================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${NOTIFICATION_DB_USER:notification_service}
quarkus.datasource.password=${NOTIFICATION_DB_PASSWORD}
quarkus.datasource.reactive.url=${NOTIFICATION_DB_REACTIVE_URL:postgresql://localhost:5432/ecommerce}
%dev.quarkus.datasource.reactive.max-size=10
%prod.quarkus.datasource.reactive.max-size=20
quarkus.datasource.jdbc.url=${NOTIFICATION_DB_JDBC_URL:jdbc:postgresql://localhost:5432/ecommerce}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.default-schema=notification
quarkus.flyway.schemas=notification

# =============================================================================
# SERVIDOR HTTP
# =============================================================================
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.root-path=/notifications/api/v1
quarkus.http.cors.enabled=true
quarkus.http.cors.methods=GET
quarkus.http.cors.headers=Content-Type

# =============================================================================
# KAFKA — eventos salientes Notification*, comandos entrantes SendNotification
# =============================================================================
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

mp.messaging.outgoing.notification-events-out.connector=smallrye-kafka
mp.messaging.outgoing.notification-events-out.topic=ecommerce.notification.events.v1
mp.messaging.outgoing.notification-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.notification-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.notification-events-out.acks=all
mp.messaging.outgoing.notification-events-out.enable.idempotence=true

mp.messaging.incoming.notification-commands-in.connector=smallrye-kafka
mp.messaging.incoming.notification-commands-in.topic=ecommerce.notification.commands.v1
mp.messaging.incoming.notification-commands-in.group.id=notification-service
mp.messaging.incoming.notification-commands-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.notification-commands-in.value.deserializer=com.ecommerce.notification.infrastructure.messaging.consumer.NotificationCommandMessageDeserializer
mp.messaging.incoming.notification-commands-in.auto.offset.reset=earliest
mp.messaging.incoming.notification-commands-in.enable.auto.commit=false
mp.messaging.incoming.notification-commands-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.notification-commands-in.dead-letter-queue.topic=ecommerce.notification.commands.v1.dlq

# =============================================================================
# OPENAPI / SWAGGER
# =============================================================================
mp.openapi.scan.disable=false
quarkus.swagger-ui.always-include=true

# =============================================================================
# LOGS
# =============================================================================
quarkus.log.level=INFO

# =============================================================================
# PRUEBAS
# =============================================================================
quarkus.test.continuous-testing=disabled
