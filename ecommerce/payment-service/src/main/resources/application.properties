# =============================================================================
# DATASOURCE — Postgres, esquema "payment" dentro de la base de datos compartida "ecommerce"
# =============================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${PAYMENT_DB_USER:payment_service}
quarkus.datasource.password=${PAYMENT_DB_PASSWORD}
quarkus.datasource.reactive.url=${PAYMENT_DB_REACTIVE_URL:postgresql://localhost:5432/ecommerce}
%dev.quarkus.datasource.reactive.max-size=10
%prod.quarkus.datasource.reactive.max-size=20
quarkus.datasource.jdbc.url=${PAYMENT_DB_JDBC_URL:jdbc:postgresql://localhost:5432/ecommerce}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.default-schema=payment
quarkus.flyway.schemas=payment

# =============================================================================
# SERVIDOR HTTP
# =============================================================================
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.root-path=/payments/api/v1
quarkus.http.cors.enabled=true
quarkus.http.cors.methods=GET
quarkus.http.cors.headers=Content-Type

# =============================================================================
# SIMULACIÓN DE PASARELA DE PAGO
# =============================================================================
# Rechaza cualquier ChargePayment cuyo monto supere esto — el disparador
# determinista usado para ejercitar el camino de compensación de la saga en pruebas/demos.
payment.simulation.decline-threshold=${PAYMENT_DECLINE_THRESHOLD:5000}

# =============================================================================
# KAFKA — eventos salientes Payment*, comandos entrantes ChargePayment/RefundPayment
# =============================================================================
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

mp.messaging.outgoing.payment-events-out.connector=smallrye-kafka
mp.messaging.outgoing.payment-events-out.topic=ecommerce.payment.events.v1
mp.messaging.outgoing.payment-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.payment-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.payment-events-out.acks=all
mp.messaging.outgoing.payment-events-out.enable.idempotence=true

mp.messaging.incoming.payment-commands-in.connector=smallrye-kafka
mp.messaging.incoming.payment-commands-in.topic=ecommerce.payment.commands.v1
mp.messaging.incoming.payment-commands-in.group.id=payment-service
mp.messaging.incoming.payment-commands-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.payment-commands-in.value.deserializer=com.ecommerce.payment.infrastructure.messaging.consumer.PaymentCommandMessageDeserializer
mp.messaging.incoming.payment-commands-in.auto.offset.reset=earliest
mp.messaging.incoming.payment-commands-in.enable.auto.commit=false
mp.messaging.incoming.payment-commands-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.payment-commands-in.dead-letter-queue.topic=ecommerce.payment.commands.v1.dlq

# =============================================================================
# OPENAPI / SWAGGER
# =============================================================================
mp.openapi.scan.disable=false
quarkus.swagger-ui.always-include=true

# =============================================================================
# LOGS
# =============================================================================
quarkus.log.level=INFO

# =============================================================================
# PRUEBAS
# =============================================================================
quarkus.test.continuous-testing=disabled
