mp.messaging.incoming.shipping-events-in.connector=smallrye-kafka
mp.messaging.incoming.shipping-events-in.topic=ecommerce.shipping.events.v1
mp.messaging.incoming.shipping-events-in.group.id=saga-orchestrator
mp.messaging.incoming.shipping-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.shipping-events-in.value.deserializer=com.ecommerce.saga.infrastructure.messaging.consumer.ShippingEventMessageDeserializer
