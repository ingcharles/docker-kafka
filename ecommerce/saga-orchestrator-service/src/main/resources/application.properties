# --- Salientes: los cinco tópicos *.commands.v1 más el rastro de auditoría de la saga ---
mp.messaging.outgoing.order-commands-out.connector=smallrye-kafka
mp.messaging.outgoing.order-commands-out.topic=ecommerce.order.commands.v1
mp.messaging.outgoing.order-commands-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.order-commands-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.order-commands-out.acks=all
mp.messaging.outgoing.order-commands-out.enable.idempotence=true

