# =============================================================================
# DATASOURCE — Postgres, esquema "saga" dentro de la base de datos compartida "ecommerce"
# =============================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${SAGA_DB_USER:saga_service}
quarkus.datasource.password=${SAGA_DB_PASSWORD}
quarkus.datasource.reactive.url=${SAGA_DB_REACTIVE_URL:postgresql://localhost:5432/ecommerce}
%dev.quarkus.datasource.reactive.max-size=10
%prod.quarkus.datasource.reactive.max-size=20
quarkus.datasource.jdbc.url=${SAGA_DB_JDBC_URL:jdbc:postgresql://localhost:5432/ecommerce}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.default-schema=saga
quarkus.flyway.schemas=saga

# =============================================================================
# SERVIDOR HTTP
# =============================================================================
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.root-path=/sagas/api/v1
quarkus.http.cors.enabled=true
quarkus.http.cors.methods=GET,POST
quarkus.http.cors.headers=Content-Type

# =============================================================================
# KAFKA
# =============================================================================
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

# --- Entrantes: los cinco tópicos de respuesta *.events.v1 ---
mp.messaging.incoming.order-events-in.connector=smallrye-kafka
mp.messaging.incoming.order-events-in.topic=ecommerce.order.events.v1
mp.messaging.incoming.order-events-in.group.id=saga-orchestrator
mp.messaging.incoming.order-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.order-events-in.value.deserializer=com.ecommerce.saga.infrastructure.messaging.consumer.OrderEventMessageDeserializer
mp.messaging.incoming.order-events-in.auto.offset.reset=earliest
mp.messaging.incoming.order-events-in.enable.auto.commit=false
mp.messaging.incoming.order-events-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.order-events-in.dead-letter-queue.topic=ecommerce.order.events.v1.dlq

mp.messaging.incoming.inventory-events-in.connector=smallrye-kafka
mp.messaging.incoming.inventory-events-in.topic=ecommerce.inventory.events.v1
mp.messaging.incoming.inventory-events-in.group.id=saga-orchestrator
mp.messaging.incoming.inventory-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.inventory-events-in.value.deserializer=com.ecommerce.saga.infrastructure.messaging.consumer.InventoryEventMessageDeserializer
mp.messaging.incoming.inventory-events-in.auto.offset.reset=earliest
mp.messaging.incoming.inventory-events-in.enable.auto.commit=false
mp.messaging.incoming.inventory-events-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.inventory-events-in.dead-letter-queue.topic=ecommerce.inventory.events.v1.dlq

