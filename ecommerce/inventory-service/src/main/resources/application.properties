# =============================================================================
# DATASOURCE — Postgres, esquema "inventory" dentro de la base de datos compartida "ecommerce"
# =============================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${INVENTORY_DB_USER:inventory_service}
quarkus.datasource.password=${INVENTORY_DB_PASSWORD}
quarkus.datasource.reactive.url=${INVENTORY_DB_REACTIVE_URL:postgresql://localhost:5432/ecommerce}
%dev.quarkus.datasource.reactive.max-size=10
%prod.quarkus.datasource.reactive.max-size=20
quarkus.datasource.jdbc.url=${INVENTORY_DB_JDBC_URL:jdbc:postgresql://localhost:5432/ecommerce}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.default-schema=inventory
quarkus.flyway.schemas=inventory

# =============================================================================
# SERVIDOR HTTP
# =============================================================================
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.root-path=/inventory/api/v1
quarkus.http.cors.enabled=true
quarkus.http.cors.methods=GET,POST
quarkus.http.cors.headers=Content-Type

# =============================================================================
# KAFKA — eventos salientes Stock*, comandos entrantes ReserveStock/ReleaseStock
# =============================================================================
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

mp.messaging.outgoing.inventory-events-out.connector=smallrye-kafka
mp.messaging.outgoing.inventory-events-out.topic=ecommerce.inventory.events.v1
mp.messaging.outgoing.inventory-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.inventory-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.inventory-events-out.acks=all
mp.messaging.outgoing.inventory-events-out.enable.idempotence=true

mp.messaging.incoming.inventory-commands-in.connector=smallrye-kafka
mp.messaging.incoming.inventory-commands-in.topic=ecommerce.inventory.commands.v1
mp.messaging.incoming.inventory-commands-in.group.id=inventory-service
mp.messaging.incoming.inventory-commands-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.inventory-commands-in.value.deserializer=com.ecommerce.inventory.infrastructure.messaging.consumer.InventoryCommandMessageDeserializer
mp.messaging.incoming.inventory-commands-in.auto.offset.reset=earliest
mp.messaging.incoming.inventory-commands-in.enable.auto.commit=false
mp.messaging.incoming.inventory-commands-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.inventory-commands-in.dead-letter-queue.topic=ecommerce.inventory.commands.v1.dlq

# =============================================================================
# OPENAPI / SWAGGER
# =============================================================================
mp.openapi.scan.disable=false
quarkus.swagger-ui.always-include=true

# =============================================================================
# LOGS
# =============================================================================
quarkus.log.level=INFO

# =============================================================================
# PRUEBAS
# =============================================================================
quarkus.test.continuous-testing=disabled
