# =============================================================================
# DATASOURCE — Postgres, esquema "orders" dentro de la base de datos compartida "ecommerce"
# =============================================================================
# "order" es una palabra reservada de SQL, por eso "orders" (el esquema de
# cada uno de los demás servicios es simplemente su nombre de dominio —
# esta es la única excepción). El search_path por defecto del rol
# order_service se fija del lado del servidor
# (ALTER ROLE ... SET search_path = orders) en ecommerce/db/init/00-schemas.sh,
# así que los nombres de tabla de abajo van sin calificar a propósito.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${ORDER_DB_USER:order_service}
quarkus.datasource.password=${ORDER_DB_PASSWORD}
# Pool reactivo: lo usa la aplicación en tiempo de ejecución (Hibernate Reactive Panache).
quarkus.datasource.reactive.url=${ORDER_DB_REACTIVE_URL:postgresql://localhost:5432/ecommerce}
%dev.quarkus.datasource.reactive.max-size=10
%prod.quarkus.datasource.reactive.max-size=20
# Pool JDBC bloqueante: lo usa únicamente Flyway al arrancar, Hibernate Reactive nunca lo toca.
quarkus.datasource.jdbc.url=${ORDER_DB_JDBC_URL:jdbc:postgresql://localhost:5432/ecommerce}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.default-schema=orders
quarkus.flyway.schemas=orders

# =============================================================================
# SERVIDOR HTTP
# =============================================================================
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.root-path=/orders/api/v1
quarkus.http.cors.enabled=true
quarkus.http.cors.methods=GET,POST
quarkus.http.cors.headers=Content-Type

# =============================================================================
# KAFKA — eventos salientes OrderCreated, comandos entrantes ConfirmOrder/CancelOrder
# =============================================================================
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

mp.messaging.outgoing.order-events-out.connector=smallrye-kafka
mp.messaging.outgoing.order-events-out.topic=ecommerce.order.events.v1
mp.messaging.outgoing.order-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.order-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.order-events-out.acks=all
mp.messaging.outgoing.order-events-out.enable.idempotence=true

mp.messaging.incoming.order-commands-in.connector=smallrye-kafka
mp.messaging.incoming.order-commands-in.topic=ecommerce.order.commands.v1
mp.messaging.incoming.order-commands-in.group.id=order-service
mp.messaging.incoming.order-commands-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.order-commands-in.value.deserializer=com.ecommerce.order.infrastructure.messaging.consumer.OrderCommandMessageDeserializer
mp.messaging.incoming.order-commands-in.auto.offset.reset=earliest
mp.messaging.incoming.order-commands-in.enable.auto.commit=false
mp.messaging.incoming.order-commands-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.order-commands-in.dead-letter-queue.topic=ecommerce.order.commands.v1.dlq

# =============================================================================
# OPENAPI / SWAGGER
# =============================================================================
mp.openapi.scan.disable=false
quarkus.swagger-ui.always-include=true

# =============================================================================
# LOGS
# =============================================================================
quarkus.log.level=INFO

# =============================================================================
# PRUEBAS
# =============================================================================
quarkus.test.continuous-testing=disabled
