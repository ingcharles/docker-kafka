# =============================================================================
# DATASOURCE — Postgres, esquema "shipping" dentro de la base de datos compartida "ecommerce"
# =============================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${SHIPPING_DB_USER:shipping_service}
quarkus.datasource.password=${SHIPPING_DB_PASSWORD}
quarkus.datasource.reactive.url=${SHIPPING_DB_REACTIVE_URL:postgresql://localhost:5432/ecommerce}
%dev.quarkus.datasource.reactive.max-size=10
%prod.quarkus.datasource.reactive.max-size=20
quarkus.datasource.jdbc.url=${SHIPPING_DB_JDBC_URL:jdbc:postgresql://localhost:5432/ecommerce}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.default-schema=shipping
quarkus.flyway.schemas=shipping

# =============================================================================
# SERVIDOR HTTP
# =============================================================================
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.root-path=/shipping/api/v1
quarkus.http.cors.enabled=true
quarkus.http.cors.methods=GET
quarkus.http.cors.headers=Content-Type

# =============================================================================
# KAFKA — eventos salientes Shipment*, comandos entrantes CreateShipment/CancelShipment
# =============================================================================
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

mp.messaging.outgoing.shipping-events-out.connector=smallrye-kafka
mp.messaging.outgoing.shipping-events-out.topic=ecommerce.shipping.events.v1
mp.messaging.outgoing.shipping-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.shipping-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.shipping-events-out.acks=all
mp.messaging.outgoing.shipping-events-out.enable.idempotence=true

mp.messaging.incoming.shipping-commands-in.connector=smallrye-kafka
mp.messaging.incoming.shipping-commands-in.topic=ecommerce.shipping.commands.v1
mp.messaging.incoming.shipping-commands-in.group.id=shipping-service
mp.messaging.incoming.shipping-commands-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.shipping-commands-in.value.deserializer=com.ecommerce.shipping.infrastructure.messaging.consumer.ShippingCommandMessageDeserializer
mp.messaging.incoming.shipping-commands-in.auto.offset.reset=earliest
mp.messaging.incoming.shipping-commands-in.enable.auto.commit=false
mp.messaging.incoming.shipping-commands-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.shipping-commands-in.dead-letter-queue.topic=ecommerce.shipping.commands.v1.dlq

# =============================================================================
# OPENAPI / SWAGGER
# =============================================================================
mp.openapi.scan.disable=false
quarkus.swagger-ui.always-include=true

# =============================================================================
# LOGS
# =============================================================================
quarkus.log.level=INFO

# =============================================================================
# PRUEBAS
# =============================================================================
quarkus.test.continuous-testing=disabled
