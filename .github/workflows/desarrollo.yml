# Push a la rama desarrollo: pruebas, imágenes en Harbor y promoción a overlays/desarrollo del repositorio de despliegue (automática).
# Pull request a desarrollo: solo pruebas.
# Ejecución manual: construye y despliega en desarrollo la rama que elijas (útil para probar una funcionalidad antes del merge).
#
# BANDERA: la variable de repositorio CI_PLATAFORMA elige quién corre el pipeline.
#   (sin definir) o "github" -> corre este workflow.      "gitlab" -> este workflow no hace nada; corre /.gitlab-ci.yml.
name: desarrollo

on:
  push:
    branches: [desarrollo]
    paths:
      - "facturacion-electronica-ec/**"
      - "kafka/topic-init/**"
      - ".github/workflows/facturacion-flujo.yml"
      - ".github/workflows/desarrollo.yml"
  pull_request:
    branches: [desarrollo]
    paths:
      - "facturacion-electronica-ec/**"
      - "kafka/topic-init/**"
      - ".github/workflows/facturacion-flujo.yml"
      - ".github/workflows/desarrollo.yml"
  workflow_dispatch:

concurrency:
  group: facturacion-desarrollo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  flujo:
    if: ${{ vars.CI_PLATAFORMA != 'gitlab' }}
    uses: ./.github/workflows/facturacion-flujo.yml
    with:
      ambiente: desarrollo
      publicar: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
