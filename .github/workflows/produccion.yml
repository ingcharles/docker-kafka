# Push a la rama produccion (merge de un pull request desde pruebas): pruebas, imágenes y, tras la APROBACIÓN del environment
# "produccion", promoción a overlays/produccion del repositorio de despliegue.
#   Settings > Environments > produccion: Required reviewers (quién aprueba) y Deployment branches = solo la rama produccion.
#   La rama produccion debe estar protegida (pull request con aprobación).
# Pull request a produccion: solo pruebas.
#
# BANDERA: la variable de repositorio CI_PLATAFORMA elige quién corre el pipeline.
#   (sin definir) o "github" -> corre este workflow.      "gitlab" -> este workflow no hace nada; corre /.gitlab-ci.yml.
name: produccion

on:
  push:
    branches: [produccion]
    paths:
      - "facturacion-electronica-ec/**"
      - "kafka/topic-init/**"
      - ".github/workflows/facturacion-flujo.yml"
      - ".github/workflows/produccion.yml"
  pull_request:
    branches: [produccion]
    paths:
      - "facturacion-electronica-ec/**"
      - "kafka/topic-init/**"
      - ".github/workflows/facturacion-flujo.yml"
      - ".github/workflows/produccion.yml"

concurrency:
  group: facturacion-produccion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  flujo:
    if: ${{ vars.CI_PLATAFORMA != 'gitlab' }}
    uses: ./.github/workflows/facturacion-flujo.yml
    with:
      ambiente: produccion
      publicar: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
